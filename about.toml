# Licenses `cargo about` accepts in the release binary's dependency tree.
# THIRD-PARTY-NOTICES in each release archive is generated from this and
# about.hbs; CI fails if a dependency brings a license not listed here.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# Only what is linked into the binary: not the workspace's own crates, not
# build scripts or test-only dependencies.
private = { ignore = true }
ignore-build-dependencies = true
ignore-dev-dependencies = true
