name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, against the latest cdp-kernel and Jupyter instead of the pins
  # below, and against any RustSec advisory published since the last run,
  # so drift shows up here before it breaks a pull request.
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on main finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # What the end-to-end jobs install, in one place: e2e and image here,
  # and scripts/test-workstation.sh and scripts/test-install.sh read
  # CDP_KERNEL_VERSION; container/Dockerfile has it as a default too. Bump them together in one pull request
  # (docs/development.md); scripts/release.sh moves CDP_KERNEL_VERSION in the release commit. The scheduled run takes the latest releases.
  CDP_KERNEL_VERSION: ${{ github.event_name == 'schedule' && 'latest' || '0.10.0' }}
  E2E_PYTHON_PACKAGES: ${{ github.event_name == 'schedule' && 'ipykernel nbclient jupyter_server jupyter_ydoc pycrdt websockets' || 'ipykernel==7.4.0 nbclient==0.11.0 jupyter_server==2.21.1 jupyter_ydoc==4.2.0 pycrdt==0.14.10 websockets==17.4' }}
  # nb-cli for validation/nb-cli.sh in the workstation job; empty means
  # the latest release.
  NB_CLI_VERSION: ${{ github.event_name == 'schedule' && '' || '0.0.10' }}

  # The lsp job: JupyterLab, its LSP extension and the oracle, and the
  # language servers both sides run.
  LSP_PYTHON_PACKAGES: jupyterlab==4.6.6 jupyterlab-lsp==5.3.0 jupyter-lsp==2.3.1 ipykernel==7.4.0
  LSP_NPM_PACKAGES: typescript-language-server@5.3.0 typescript@5.9.3 pyright@1.1.414

jobs:
  # Whether a pull request, or a push to main, needs the jobs below:
  # scripts/ci-changes.sh says no when it changes only docs, the site or
  # Markdown (#418, #458). The jobs
  # then report success under their required names without building:
  # the others are skipped by their `if`, and each matrix cell (e2e, ffi,
  # install-script, workstation) runs on Linux with every step skipped,
  # since a matrix job skipped whole wouldn't report per-cell checks. If
  # this job fails, its output is empty and everything runs. The
  # schedule and manual runs run everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}
      ffi: ${{ steps.changes.outputs.ffi }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and its first parent, the base.
          fetch-depth: 2
      - id: changes
        run: scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"
        env:
          # A push's base: main before the push (the script fetches it).
          BASE_SHA: ${{ github.event.before }}

  rust:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p ganymede-engine --no-default-features -- -D warnings
      - run: cargo clippy -p ganymede-cli --all-targets --features crash-reporting -- -D warnings
      # No Windows test job (#60); this at least type-checks the Windows
      # process code (job objects) on every PR.
      - run: cargo clippy -p ganymede-kernel-host --all-targets --target x86_64-pc-windows-gnu -- -D warnings
      - name: cargo doc (warnings are errors)
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # No real kernels or Jupyter here, so the end-to-end tests that need
      # them skip; the summary lists them, and the e2e job runs them all.
      - name: cargo test --workspace
        run: |
          set -o pipefail
          cargo test --workspace -- --nocapture 2>&1 | tee "$RUNNER_TEMP/test.log"
      # The workspace build turns `sqlite` on, since the server needs it.
      # Alone, the contents crate builds without it, as for iOS and
      # Android: notebook signatures are kept in memory.
      - name: cargo test -p ganymede-contents (without sqlite)
        run: cargo test -p ganymede-contents
      # The scrubbing and opt-in tests guard docs/privacy.md and need the
      # feature release builds turn on.
      - name: cargo test crash reporting (with the crash-reporting feature)
        run: cargo test -p ganymede-cli --features crash-reporting --bin ganymede crash
      - name: List skipped tests
        if: ${{ !cancelled() }}
        run: |
          n=$(grep -o 'skipping: .*' "$RUNNER_TEMP/test.log" | wc -l | tr -d ' ')
          {
            echo "### $n tests skipped (no real kernels or Jupyter in this job; e2e runs them)"
            echo
            grep -o 'skipping: .*' "$RUNNER_TEMP/test.log" | sort | uniq -c | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Skipped tests::$n tests skipped in this job; the e2e job runs them with nothing skipped"
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-about
      - name: Dependency licenses are all accepted in about.toml
        run: cargo about generate --locked --fail --features crash-reporting -m crates/ganymede-cli/Cargo.toml about.hbs -o /dev/null

  # The oldest Rust the workspace says it supports (rust-version in
  # Cargo.toml) still builds it.
  msrv:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: msrv
        name: Read rust-version from Cargo.toml
        run: |
          v=$(sed -n '/^\[workspace.package\]/,/^\[/s/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --workspace --all-targets --locked

  # RustSec advisories against Cargo.lock, duplicate crate versions (as
  # warnings), and crate sources (deny.toml). Licenses are the rust job's
  # cargo-about step.
  audit:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-deny
      - run: cargo deny --locked check advisories bans sources

  # The end-to-end suite with real kernels and the Jupyter reference
  # implementation installed, so nothing in it skips: notebooks against
  # `jupyter execute`, the server against `jupyter server`, and the same
  # kernel scenarios on cdp-kernel and ipykernel. Python is a test oracle
  # and a kernel here, never a dependency of the product.
  e2e:
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ needs.changes.outputs.code == 'false' && 'ubuntu-latest' || matrix.os }}
    timeout-minutes: 15
    env:
      GANYMEDE_E2E_KERNELS: cdp-node,python3
      GANYMEDE_E2E_REQUIRE_JUPYTER: "1"
      GANYMEDE_E2E_LAB: "1"
      GANYMEDE_E2E_UI: "1"
    steps:
      - if: needs.changes.outputs.code == 'false'
        run: echo "Only docs, the site or Markdown changed, so nothing to build (#418)."
      - if: needs.changes.outputs.code != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.changes.outputs.code != 'false'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - if: needs.changes.outputs.code != 'false'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: needs.changes.outputs.code != 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - if: needs.changes.outputs.code != 'false'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          # The pins live in this file.
          cache-dependency-path: .github/workflows/ci.yml
      - if: needs.changes.outputs.code != 'false'
        name: Install kernels and the reference implementation
        run: |
          npm install -g "@tlockney/cdp-kernel@$CDP_KERNEL_VERSION"
          cdp-kernel install --runtime node
          # Word splitting is wanted: a list of requirements.
          # shellcheck disable=SC2086
          python -m pip install $E2E_PYTHON_PACKAGES
          python -m pip list | grep -Ei '^(ipykernel|nbclient|jupyter.server|jupyter.ydoc|pycrdt|websockets) '
          python -m ipykernel install --user --name python3
          echo "GANYMEDE_E2E_JUPYTER=$(command -v jupyter)" >> "$GITHUB_ENV"
          # The Python that has the rooms oracle; collab.rs fails if it can't
          # import it, rather than skipping.
          echo "GANYMEDE_E2E_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - if: needs.changes.outputs.code != 'false'
        run: cargo run -q -p ganymede-cli -- kernelspec list
      # The whole workspace, so the unit tests also run on macOS.
      - if: needs.changes.outputs.code != 'false'
        name: cargo test --workspace
        run: |
          set -o pipefail
          cargo test --workspace -- --nocapture 2>&1 | tee "$RUNNER_TEMP/test.log"
      # The GANYMEDE_E2E_* variables above already make a missing kernel or
      # Jupyter a failure; this catches any other way a test could skip.
      - if: needs.changes.outputs.code != 'false'
        name: Nothing skipped
        run: |
          if grep -o 'skipping: .*' "$RUNNER_TEMP/test.log"; then
            echo "::error title=Skipped tests::tests skipped in the job that must run them all"
            exit 1
          fi

  # Line coverage of the whole test suite, kernels and Jupyter included as
  # in e2e, in the job summary, with a row per changed file on a pull
  # request. Informational: nothing fails on a number (#255).
  coverage:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GANYMEDE_E2E_KERNELS: cdp-node,python3
      GANYMEDE_E2E_REQUIRE_JUPYTER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-llvm-cov
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      - name: Install kernels and the reference implementation
        run: |
          npm install -g "@tlockney/cdp-kernel@$CDP_KERNEL_VERSION"
          cdp-kernel install --runtime node
          # shellcheck disable=SC2086
          python -m pip install $E2E_PYTHON_PACKAGES
          python -m ipykernel install --user --name python3
          echo "GANYMEDE_E2E_JUPYTER=$(command -v jupyter)" >> "$GITHUB_ENV"
          # The Python that has the rooms oracle; collab.rs fails if it can't
          # import it, rather than skipping.
          echo "GANYMEDE_E2E_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - name: cargo llvm-cov --workspace
        run: |
          cargo llvm-cov --workspace --no-report
          cargo llvm-cov report --json --summary-only --output-path "$RUNNER_TEMP/cov.json"
          cargo llvm-cov report --summary-only
      - name: Coverage summary
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=
          if [ -n "$BASE_SHA" ]; then
            changed=$(git diff --name-only "$BASE_SHA"...HEAD -- '*.rs')
          fi
          # Word splitting is wanted: one argument per changed path.
          # shellcheck disable=SC2086
          node scripts/coverage-summary.mjs "$RUNNER_TEMP/cov.json" $changed >> "$GITHUB_STEP_SUMMARY"

  # cdp-kernel's main branch instead of a release, weekly and on request,
  # so a change on either side shows up before cdp-kernel releases it:
  # the kernel scenarios and the jupyter_server comparison on cdp-node.
  e2e-cdp-kernel-main:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GANYMEDE_E2E_KERNELS: cdp-node
      GANYMEDE_E2E_REQUIRE_JUPYTER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install cdp-kernel from main, and the reference implementation
        run: |
          git clone --depth 1 https://github.com/tlockney/cdp-kernel "$RUNNER_TEMP/cdp-kernel"
          cd "$RUNNER_TEMP/cdp-kernel"
          git log -1 --format='cdp-kernel main at %H'
          npm ci
          # npm pack builds (prepack) and prints the tarball's name last.
          npm install -g "$PWD/$(npm pack --silent | tail -n 1)"
          cdp-kernel install --runtime node
          # shellcheck disable=SC2086
          python -m pip install $E2E_PYTHON_PACKAGES
          echo "GANYMEDE_E2E_JUPYTER=$(command -v jupyter)" >> "$GITHUB_ENV"
          # The Python that has the rooms oracle; collab.rs fails if it can't
          # import it, rather than skipping.
          echo "GANYMEDE_E2E_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - run: cargo test -p ganymede-cli

  # Weekly and on request: whether PyPI has newer JupyterLab or default
  # extension releases than `ganymede lab install` pins (#433). A failure
  # means a pin to bump, not a broken build.
  pins:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/check-pins.sh
      # What the next release would move the cdp-kernel and ganymede-ui
      # pins to (#673); fails only if a pin is ahead of the latest release.
      - if: ${{ !cancelled() }}
        run: scripts/release-pins.sh --check

  # Targets the desktop CI cannot run: the core libraries must build for
  # iOS, Android, and wasm, and the engine must run a notebook inside wasm.
  # A warning fails the job: clippy runs for the desktop targets only, so
  # nothing else sees one that appears only here (#636).
  portability:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: aarch64-apple-ios, aarch64-linux-android, wasm32-unknown-unknown, wasm32-wasip1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            e2e/wasm-smoke
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Engine for iOS and Android (with ZeroMQ and subprocesses)
        run: |
          cargo check -p ganymede-engine -p ganymede-api -p ganymede-contents -p ganymede-terminals -p ganymede-lsp --target aarch64-apple-ios
          cargo check -p ganymede-engine -p ganymede-api -p ganymede-contents --target aarch64-linux-android
      - name: API for iOS without ZeroMQ or subprocesses (the in-app profile)
        run: cargo check -p ganymede-api --no-default-features --target aarch64-apple-ios
      - name: Engine starts and restarts an in-process kernel without ZeroMQ
        run: cargo test -p ganymede-engine --no-default-features --test in_process
      - name: Server serves an app's own kernels without ZeroMQ or subprocesses
        run: cargo test -p ganymede-server --no-default-features --test embedded
      - name: ganymede-ffi as the iOS slices build it (no ZeroMQ or subprocesses)
        run: cargo test -p ganymede-ffi --no-default-features --features gateway
      - name: Core libraries for browser wasm
        run: cargo check -p ganymede-engine -p ganymede-api -p ganymede-contents --no-default-features --target wasm32-unknown-unknown
      # e2e/wasm-smoke is its own workspace with its own tracked lockfile,
      # which no other build reads. --locked fails the job when it is
      # stale: a workspace crate it depends on changed version (every
      # release) or dependencies (#636).
      - name: Engine runs a notebook under WASI
        working-directory: e2e/wasm-smoke
        run: |
          # Cargo's error for a stale lockfile names no fix, so the
          # annotation does. Any other failure shows as cargo printed it.
          if ! err=$(cargo metadata --locked --format-version 1 2>&1 > /dev/null); then
            echo "$err" >&2
            if grep -q -e '--locked was passed to prevent this' <<< "$err"; then
              echo "::error file=e2e/wasm-smoke/Cargo.lock::e2e/wasm-smoke/Cargo.lock is out of date. Run: cargo update --manifest-path e2e/wasm-smoke/Cargo.toml --workspace"
            fi
            exit 1
          fi
          cargo build --release --locked --target wasm32-wasip1
          node run.mjs target/wasm32-wasip1/release/ganymede-wasm-smoke.wasm > out.ipynb
          grep -q '"ONE"' out.ipynb

  # The C ABI the Swift shell links (crates/ganymede-ffi): the header
  # matches the library on Linux and macOS, and the XCFramework builds.
  # The macOS cell builds only when the change can affect ganymede-ffi
  # (ci-changes.sh's ffi); otherwise it reports from an ubuntu runner and
  # leaves the macOS runner free (#457).
  #
  # Both cells build without LTO and with the default codegen units, on
  # every event, so a PR's cache from main matches: this checks that the
  # slices build and the framework assembles. release.yml builds the
  # published framework with the full release profile on every push to
  # main and every tag (#456).
  ffi:
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ (needs.changes.outputs.code == 'false' || (matrix.os == 'macos-latest' && needs.changes.outputs.ffi == 'false')) && 'ubuntu-latest' || matrix.os }}
    timeout-minutes: 60
    env:
      BUILD: ${{ needs.changes.outputs.code != 'false' && (matrix.os != 'macos-latest' || needs.changes.outputs.ffi != 'false') }}
      # The weekly scheduled run keeps Cargo.toml's release profile (#457).
      CARGO_PROFILE_RELEASE_LTO: ${{ github.event_name == 'schedule' && 'thin' || 'off' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ github.event_name == 'schedule' && '1' || '16' }}
    steps:
      - if: env.BUILD != 'true'
        # Quoted: in a plain scalar, " #" would start a YAML comment.
        run: 'echo "Nothing ganymede-ffi builds from changed, so nothing to build (#418, #457)."'
      - if: env.BUILD == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: env.BUILD == 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin, aarch64-apple-ios, aarch64-apple-ios-sim' || '' }}
      - if: env.BUILD == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # ci-changes.sh's ffi output assumes these two crates stay outside
      # ganymede-ffi's dependency tree.
      - if: env.BUILD == 'true' && matrix.os == 'ubuntu-latest'
        name: ganymede-cli and ganymede-engine stay out of ganymede-ffi
        run: |
          if cargo tree --locked -p ganymede-ffi --all-features --target all -e normal,build --prefix none | grep -E '^ganymede-(cli|engine) '; then
            echo "::error::ganymede-ffi now depends on a crate scripts/ci-changes.sh treats as outside it; update the script"
            exit 1
          fi
      - if: env.BUILD == 'true'
        run: scripts/ffi-smoke.sh
      - if: env.BUILD == 'true' && matrix.os == 'macos-latest'
        run: scripts/build-xcframework.sh
      - if: env.BUILD == 'true' && matrix.os == 'macos-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GanymedeFFI.xcframework
          path: target/xcframework/GanymedeFFI.xcframework.zip
          retention-days: 14

  # site/install.sh against a stub release served over file://, under sh,
  # bash, and dash, then once more installing cdp-kernel
  # (CDP_KERNEL_VERSION) on Node 24. Linux only: the workstation job runs
  # the same checks on macOS at its end, which saves a macOS runner per
  # run (#459). The matrix keeps the required check's name.
  install-script:
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ needs.changes.outputs.code == 'false' && 'ubuntu-latest' || matrix.os }}
    timeout-minutes: 15
    steps:
      - if: needs.changes.outputs.code == 'false'
        run: echo "Only docs, the site or Markdown changed, so nothing to build (#418)."
      - if: needs.changes.outputs.code != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.changes.outputs.code != 'false'
        run: shellcheck -s sh site/install.sh scripts/test-install.sh scripts/test-workstation.sh validation/nb-cli.sh scripts/ci-changes.sh
      - if: needs.changes.outputs.code != 'false'
        run: scripts/test-install.sh sh
      - if: needs.changes.outputs.code != 'false'
        run: scripts/test-install.sh bash
      - if: needs.changes.outputs.code != 'false'
        run: scripts/test-install.sh dash
      - if: needs.changes.outputs.code != 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - if: needs.changes.outputs.code != 'false'
        run: TEST_KERNEL=1 scripts/test-install.sh sh

  # The container image (container/Dockerfile, #203) built from the
  # checkout, then container/smoke-test.sh: no Python in it, a cell on
  # cdp-node, and `ganymede lab` serving behind its token.
  image:
    needs: [changes, linux-release]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck -s sh container/smoke-test.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ganymede-linux-release
          path: container/bin
      - run: chmod +x container/bin/ganymede
      - run: >-
          docker build -f container/Dockerfile -t ganymede
          --build-arg GANYMEDE_SOURCE=local
          --build-arg "CDP_KERNEL_VERSION=$CDP_KERNEL_VERSION" .
      - run: container/smoke-test.sh ganymede
        timeout-minutes: 5

  # The ganymede-journal Claude Code plugin (#315): its hooks' tests,
  # end to end against this build's `ganymede mcp`, and its JSON files
  # parse.
  plugin:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked -p ganymede-cli
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: JSON files parse
        run: |
          for f in .claude-plugin/marketplace.json plugins/ganymede-journal/.claude-plugin/plugin.json \
                   plugins/ganymede-journal/.mcp.json plugins/ganymede-journal/hooks/hooks.json; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$f"
          done
      - name: Hook tests
        run: node --test plugins/ganymede-journal/hooks/journal.test.mjs
        env:
          GANYMEDE_E2E_BIN: ${{ github.workspace }}/target/debug/ganymede
      - name: Journal eval scoring tests
        run: node --test evals/journal/score.test.mjs

  # The Linux release binary, built once and used by lsp, workstation
  # (ubuntu) and image instead of each compiling it (#460). It builds in
  # the Dockerfile's Rust image (Debian trixie), so it links against the
  # image's glibc: a binary built on the runner needs the runner's newer
  # glibc and won't start in the image. The rust image in
  # container/Dockerfile has the same tag.
  linux-release:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    container: rust:1.95-trixie
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release --locked -p ganymede-cli
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ganymede-linux-release
          path: target/release/ganymede
          if-no-files-found: error
          retention-days: 1

  # jupyterlab-lsp against `ganymede serve`, with jupyter-lsp on
  # `jupyter lab` as the oracle: the same diagnostics from
  # typescript-language-server and pyright on both (#257).
  lsp:
    needs: [changes, linux-release]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ganymede-linux-release
          path: target/release
      # Artifacts don't keep the executable bit.
      - run: chmod +x target/release/ganymede
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: validation/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('validation/package-lock.json') }}
      - name: Install JupyterLab, the LSP extensions, and language servers
        run: |
          # Word splitting is wanted: a list of requirements.
          # shellcheck disable=SC2086
          python -m pip install $LSP_PYTHON_PACKAGES
          # shellcheck disable=SC2086
          npm install -g $LSP_NPM_PACKAGES
          cd validation
          npm ci
          npx playwright install --with-deps chromium
      - name: jupyterlab-lsp on Ganymede and on jupyter-lsp
        run: scripts/test-lsp.sh target/release/ganymede
        env:
          OUT_DIR: ${{ runner.temp }}/lsp
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lsp
          path: ${{ runner.temp }}/lsp
          if-no-files-found: ignore

  # docs/install.md on a workstation with no Python: the PR's release
  # binary, packaged as release.yml does, installed by site/install.sh over
  # file://; cdp-kernel (CDP_KERNEL_VERSION) from npm on Node 24; JupyterLab
  # from `ganymede lab install`; then `ganymede lab --no-browser` driven by
  # Playwright. scripts/test-workstation.sh hides Python from PATH and
  # fails if anything ran it.
  #
  # Linux takes linux-release's binary (#460) and macOS builds its own, so
  # macOS is a job of its own (workstation-macos, same check name and the
  # same steps via the anchor) that doesn't wait for linux-release before
  # queueing for a runner.
  workstation:
    needs: [changes, linux-release]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ needs.changes.outputs.code == 'false' && 'ubuntu-latest' || matrix.os }}
    timeout-minutes: 40
    steps: &workstation-steps
      - if: needs.changes.outputs.code == 'false'
        run: echo "Only docs, the site or Markdown changed, so nothing to build (#418)."
      - if: needs.changes.outputs.code != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.changes.outputs.code != 'false' && matrix.os == 'ubuntu-latest'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ganymede-linux-release
          path: target/release
      - if: needs.changes.outputs.code != 'false' && matrix.os == 'ubuntu-latest'
        run: chmod +x target/release/ganymede
      - if: needs.changes.outputs.code != 'false' && matrix.os != 'ubuntu-latest'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - if: needs.changes.outputs.code != 'false' && matrix.os != 'ubuntu-latest'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: needs.changes.outputs.code != 'false' && matrix.os != 'ubuntu-latest'
        run: cargo build --release --locked -p ganymede-cli
      - if: needs.changes.outputs.code != 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: validation/package-lock.json
      # Test tooling only, set up before Python is hidden. The browser
      # download is cached; the system libraries (--with-deps) are not.
      - if: needs.changes.outputs.code != 'false'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('validation/package-lock.json') }}
      - if: needs.changes.outputs.code != 'false'
        name: Playwright
        working-directory: validation
        run: |
          npm ci
          npx playwright install --with-deps chromium
      # nb-cli, the notebook CLI for agents (Rust, BSD-3), for
      # validation/nb-cli.sh. A test tool only, built from crates.io.
      # Restore and save are separate so a failing job still keeps the
      # binary; the scheduled run builds the latest release uncached.
      - if: needs.changes.outputs.code != 'false' && (env.NB_CLI_VERSION != '')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: nb-cli
        with:
          path: ${{ runner.temp }}/nb-cli
          key: nb-cli-${{ env.NB_CLI_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      # Linux skipped the toolchain above; a miss builds nb-cli on stable.
      - if: needs.changes.outputs.code != 'false' && matrix.os == 'ubuntu-latest' && steps.nb-cli.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - if: needs.changes.outputs.code != 'false' && (steps.nb-cli.outputs.cache-hit != 'true')
        run: cargo install nb-cli ${NB_CLI_VERSION:+--version "$NB_CLI_VERSION"} --locked --root "$RUNNER_TEMP/nb-cli"
      - if: needs.changes.outputs.code != 'false' && (env.NB_CLI_VERSION != '' && steps.nb-cli.outputs.cache-hit != 'true')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nb-cli
          key: nb-cli-${{ env.NB_CLI_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - if: needs.changes.outputs.code != 'false'
        name: Install and use Ganymede with no Python on PATH
        run: scripts/test-workstation.sh target/release/ganymede
        env:
          OUT_DIR: ${{ runner.temp }}/workstation
          NB: ${{ runner.temp }}/nb-cli/bin/nb
      # install-script's checks on macOS (#459), here rather than on a
      # macOS runner of their own. They run even if the workstation test
      # failed. bash stands in for dash, which macOS lacks; TEST_KERNEL
      # goes last since it changes the global npm packages.
      - if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && matrix.os == 'macos-latest' }}
        name: site/install.sh under sh
        run: scripts/test-install.sh sh
      - if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && matrix.os == 'macos-latest' }}
        name: site/install.sh under bash
        run: scripts/test-install.sh bash
      - if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && matrix.os == 'macos-latest' }}
        name: site/install.sh installing cdp-kernel
        run: TEST_KERNEL=1 scripts/test-install.sh sh
      - if: needs.changes.outputs.code != 'false' && (failure())
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workstation-${{ matrix.os }}
          path: ${{ runner.temp }}/workstation
          if-no-files-found: ignore

  workstation-macos:
    name: workstation (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ needs.changes.outputs.code == 'false' && 'ubuntu-latest' || matrix.os }}
    timeout-minutes: 40
    steps: *workstation-steps
