name: Release

# scripts/release.sh pushes a `v*` tag, which builds the `ganymede` binary
# for each target, packages it with SHA-256 checksums, and publishes a
# GitHub Release whose notes are the version's CHANGELOG.md section, with
# a build provenance attestation per archive, then pushes the container
# image (container/Dockerfile) to ghcr.io. Pull requests that touch the
# release tooling, and manual runs, build and package without publishing.
# docs/releasing.md says what to do when a run fails.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [.github/workflows/release.yml, release.toml, cliff.toml, scripts/release.sh, Cargo.toml]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref; a release in progress is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        name: Read the workspace version; a tag must match it
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          test -n "$version"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match workspace version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest, cross: true }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      NAME: ganymede-${{ needs.version.outputs.version }}-${{ matrix.target }}
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked -p ganymede-cli --target "$TARGET"
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-about
      - name: Third-party notices for this target's dependency tree
        run: cargo about generate --locked --fail --target "$TARGET" -m crates/ganymede-cli/Cargo.toml about.hbs -o THIRD-PARTY-NOTICES
      - name: Check the binary reports the release version
        if: ${{ !matrix.cross }}
        run: |
          out=$("target/$TARGET/release/ganymede" --version)
          echo "$out"
          [[ "$out" == "ganymede $VERSION" ]]
      # x86_64 macOS is cross-built on the arm64 runner; run it under
      # Rosetta so it is checked like the native ones.
      - name: Check the x86_64 macOS binary under Rosetta
        if: ${{ matrix.target == 'x86_64-apple-darwin' }}
        run: |
          if ! arch -x86_64 /usr/bin/true 2> /dev/null; then
            softwareupdate --install-rosetta --agree-to-license
          fi
          out=$(arch -x86_64 "target/$TARGET/release/ganymede" --version)
          echo "$out"
          [[ "$out" == "ganymede $VERSION" ]]
      - name: Package
        run: |
          exe=ganymede
          [[ "$TARGET" == *windows* ]] && exe=ganymede.exe
          mkdir -p "dist/$NAME"
          cp "target/$TARGET/release/$exe" README.md LICENSE THIRD-PARTY-NOTICES "dist/$NAME/"
          cd dist
          if [[ "$TARGET" == *windows* ]]; then
            archive="$NAME.zip"
            7z a -tzip "$archive" "$NAME" > /dev/null
          else
            archive="$NAME.tar.gz"
            tar -czf "$archive" "$NAME"
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          cat "$archive.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.NAME }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # Dispatch pages.yml to redeploy the site.
      actions: write
      # Build provenance: an OIDC token to sign with, and the right to
      # store the attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Combine checksums
        working-directory: dist
        run: |
          cat ./*.sha256 > SHA256SUMS
          sha256sum -c SHA256SUMS
      # A signed SLSA provenance statement per archive: this repository,
      # workflow, tag, and commit built it. The checksums only catch a
      # damaged download; `gh attestation verify <archive> --repo
      # tlockney/ganymede` checks this (docs/install.md).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Take the release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '/^## /{p = index($0, "## [" v "]") == 1; next} p' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q . "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section for $VERSION; cut releases with scripts/release.sh"
            exit 1
          fi
          cat "$RUNNER_TEMP/notes.md"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag \
            "${flags[@]}"
      # Redeploy the site from main (pages.yml) now that this release's
      # binaries are downloadable, so it carries the release's version and
      # changelog.
      - name: Redeploy the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

  # The container image (container/Dockerfile, #203) with the release just
  # published, pushed to ghcr.io/tlockney/ganymede as the version and, for
  # a release that isn't a prerelease, `latest`, for amd64 and arm64. The
  # amd64 build is smoke-tested before anything is pushed.
  image:
    if: github.ref_type == 'tag'
    needs: [version, release]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: container/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ganymede:test
          cache-to: type=gha,mode=max
      - run: container/smoke-test.sh ganymede:test
        timeout-minutes: 5
      - id: tags
        name: Image tags
        run: |
          {
            echo "tags<<EOF"
            echo "ghcr.io/tlockney/ganymede:$VERSION"
            [[ "$VERSION" == *-* ]] || echo "ghcr.io/tlockney/ganymede:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push (amd64, arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: container/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/tlockney/ganymede
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=MIT
