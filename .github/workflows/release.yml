name: Release

# Merging a release PR from scripts/release.sh puts a workspace version
# on main that has a CHANGELOG.md section and no tag. The main push of
# that commit is the release (#675): it builds the `ganymede` binary for
# each target, packages it with SHA-256 checksums, tags the commit
# vX.Y.Z and publishes a GitHub Release whose notes are the version's
# CHANGELOG.md section, with a build provenance attestation per archive,
# then pushes the container image (container/Dockerfile) to ghcr.io. The
# release also carries GanymedeFFI.xcframework.zip for the apps (#456). A
# run on a `v*` tag (tag-release.yml, to recover) publishes the same way.
# Pull requests that touch the release tooling, and manual runs on other
# refs, build and package without publishing. docs/releasing.md says what
# to do when a run fails.
#
# Any other push to main (or a manual run on main) builds the same
# archives as ganymede-main-<target> and replaces the assets of the
# rolling `main-build` prerelease, which `install.sh --main` installs
# (#343). Prereleases are skipped by /releases/latest, so the plain
# install still gets the latest release.

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths-ignore: ["docs/**", "site/**", "**/*.md"]
  pull_request:
    paths: [.github/workflows/release.yml, release.toml, cliff.toml, scripts/release.sh, Cargo.toml]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref; a release in progress is never cancelled. Runs on main
# are not grouped here: a newer push cancels an older one's builds (the
# build job's group), never its upload (the main-build job's group).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      # In archive names: the version, or `main` for a main build.
      label: ${{ steps.version.outputs.label }}
      # What `ganymede --version` must print after "ganymede ".
      display: ${{ steps.version.outputs.display }}
      # GANYMEDE_VERSION_BUILD for the build: `main.<commit>` on main.
      build: ${{ steps.version.outputs.build }}
      # `true` when this main push is a release commit: it publishes vX.Y.Z.
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # HEAD^ too: a release commit is the one that changed the version.
          fetch-depth: 2
      - id: version
        name: Read the workspace version; a tag must match it
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          test -n "$version"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match workspace version $version"
            exit 1
          fi
          label=$version display=$version build= release=false
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            # A release commit changed the version, has a CHANGELOG.md
            # section for it, and isn't tagged yet. Only that commit: a later
            # merge before the tag would ship a change its notes don't list.
            # A push compares with what main was before it, so a release PR
            # merged by rebase with several commits still counts; a manual
            # run compares with HEAD^.
            base=HEAD^
            if [[ "$GITHUB_EVENT_NAME" == push && -n "$BEFORE" && "$BEFORE" != 0000000000000000000000000000000000000000 ]] &&
              git fetch --quiet --depth=1 origin "$BEFORE" 2> /dev/null; then
              base=$BEFORE
            fi
            previous=$(git show "$base:Cargo.toml" 2> /dev/null |
              sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' || true)
            if [[ "$previous" != "$version" ]] &&
              grep -q "^## \[$version\]" CHANGELOG.md &&
              ! git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
              release=true
              echo "Release commit: publishing v$version"
            else
              build="main.${GITHUB_SHA::12}"
              label=main display="$version+$build"
            fi
          fi
          {
            echo "version=$version"
            echo "label=$label"
            echo "display=$display"
            echo "build=$build"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest, cross: true }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # A newer main build cancels an older one; a release build is never
    # cancelled.
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref }}-${{ matrix.target }}-${{ github.ref == 'refs/heads/main' && needs.version.outputs.release != 'true' && 'main' || github.run_id }}
      cancel-in-progress: ${{ github.ref == 'refs/heads/main' && needs.version.outputs.release != 'true' }}
    env:
      NAME: ganymede-${{ needs.version.outputs.label }}-${{ matrix.target }}
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.version.outputs.display }}
      GANYMEDE_VERSION_BUILD: ${{ needs.version.outputs.build }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      # Release binaries can send crash reports, but only when the user
      # opts in (docs/privacy.md). Debug info is kept for the upload to
      # Sentry below and stripped before packaging.
      - name: Build
        env:
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
          CARGO_PROFILE_RELEASE_STRIP: none
          CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: ${{ contains(matrix.target, 'apple') && 'packed' || 'off' }}
        run: cargo build --release --locked -p ganymede-cli --features crash-reporting --target "$TARGET"
      - name: Upload debug files to Sentry
        if: ${{ github.event_name != 'pull_request' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: lockney-technologies
          SENTRY_PROJECT: ganymede
        run: |
          if [[ -z "$SENTRY_AUTH_TOKEN" ]]; then
            echo "SENTRY_AUTH_TOKEN is not set; skipping"
            exit 0
          fi
          files=()
          for f in ganymede ganymede.exe ganymede.pdb ganymede.dSYM; do
            [[ -e "target/$TARGET/release/$f" ]] && files+=("target/$TARGET/release/$f")
          done
          npx --yes @sentry/cli@3.8.2 debug-files upload --wait "${files[@]}"
      - name: Strip debug info
        if: ${{ !contains(matrix.target, 'windows') }}
        run: |
          bin="target/$TARGET/release/ganymede"
          if [[ "$TARGET" == *apple* ]]; then strip -x "$bin"; else strip "$bin"; fi
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-about
      - name: Third-party notices for this target's dependency tree
        run: cargo about generate --locked --fail --target "$TARGET" --features crash-reporting -m crates/ganymede-cli/Cargo.toml about.hbs -o THIRD-PARTY-NOTICES
      - name: Check the binary reports the release version
        if: ${{ !matrix.cross }}
        run: |
          out=$("target/$TARGET/release/ganymede" --version)
          echo "$out"
          [[ "$out" == "ganymede $VERSION" ]]
      # x86_64 macOS is cross-built on the arm64 runner; run it under
      # Rosetta so it is checked like the native ones.
      - name: Check the x86_64 macOS binary under Rosetta
        if: ${{ matrix.target == 'x86_64-apple-darwin' }}
        run: |
          if ! arch -x86_64 /usr/bin/true 2> /dev/null; then
            softwareupdate --install-rosetta --agree-to-license
          fi
          out=$(arch -x86_64 "target/$TARGET/release/ganymede" --version)
          echo "$out"
          [[ "$out" == "ganymede $VERSION" ]]
      - name: Package
        run: |
          exe=ganymede
          [[ "$TARGET" == *windows* ]] && exe=ganymede.exe
          mkdir -p "dist/$NAME"
          cp "target/$TARGET/release/$exe" README.md LICENSE THIRD-PARTY-NOTICES "dist/$NAME/"
          cd dist
          if [[ "$TARGET" == *windows* ]]; then
            archive="$NAME.zip"
            7z a -tzip "$archive" "$NAME" > /dev/null
          else
            archive="$NAME.tar.gz"
            tar -czf "$archive" "$NAME"
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          cat "$archive.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.NAME }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  # GanymedeFFI.xcframework.zip, the static library the Mac and iPad app
  # links (docs/embedding.md), so ganymede-ui downloads it by tag instead
  # of building ganymede-ffi itself (#456). The name is the same on every
  # release and on main-build, with GanymedeFFI.xcframework.zip.sha256
  # beside it; the release's attestation and SHA256SUMS cover it.
  # Not on pull requests: CI's ffi (macos-latest) job already runs
  # build-xcframework.sh there, and macOS runners are the scarce ones.
  xcframework:
    if: github.event_name != 'pull_request'
    needs: version
    runs-on: macos-latest
    timeout-minutes: 45
    concurrency:
      group: ${{ github.workflow }}-xcframework-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && needs.version.outputs.release != 'true' && 'main' || github.run_id }}
      cancel-in-progress: ${{ github.ref == 'refs/heads/main' && needs.version.outputs.release != 'true' }}
    env:
      GANYMEDE_VERSION_BUILD: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: xcframework
      - name: Build
        run: scripts/build-xcframework.sh
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-about
      # The zip redistributes ganymede-ffi's dependencies, so their
      # notices and this repo's LICENSE travel with it, as in the CLI
      # archives.
      - name: Third-party notices
        run: |
          cargo about generate --locked --fail --target aarch64-apple-darwin --target aarch64-apple-ios --target aarch64-apple-ios-sim -m crates/ganymede-ffi/Cargo.toml about.hbs -o target/xcframework/THIRD-PARTY-NOTICES
          cp LICENSE target/xcframework/
          cd target/xcframework
          zip -q GanymedeFFI.xcframework.zip THIRD-PARTY-NOTICES LICENSE
      - name: Checksum
        run: |
          mkdir -p dist
          cp target/xcframework/GanymedeFFI.xcframework.zip dist/
          cd dist
          shasum -a 256 GanymedeFFI.xcframework.zip > GanymedeFFI.xcframework.zip.sha256
          cat GanymedeFFI.xcframework.zip.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GanymedeFFI.xcframework
          path: dist/*
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag' || needs.version.outputs.release == 'true'
    needs: [version, build, xcframework]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Two release runs of one version (a push landed before the first
    # published) publish one at a time; the second finds the tag.
    concurrency:
      group: ${{ github.workflow }}-publish-${{ needs.version.outputs.version }}
      cancel-in-progress: false
    outputs:
      # `true` when the tag was there already and nothing was published.
      skipped: ${{ steps.publish.outputs.skipped }}
    permissions:
      contents: write
      # Dispatch pages.yml to redeploy the site.
      actions: write
      # Build provenance: an OIDC token to sign with, and the right to
      # store the attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Combine checksums
        working-directory: dist
        run: |
          cat ./*.sha256 > SHA256SUMS
          sha256sum -c SHA256SUMS
      # A signed SLSA provenance statement per archive: this repository,
      # workflow, ref (main, or the tag), and commit built it. The
      # checksums only catch a damaged download; `gh attestation verify
      # <archive> --repo tlockney/ganymede` checks this (docs/install.md).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Take the release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '/^## /{p = index($0, "## [" v "]") == 1; next} p' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q . "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section for $VERSION; cut releases with scripts/release.sh"
            exit 1
          fi
          cat "$RUNNER_TEMP/notes.md"
      - name: Publish the release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          flags=()
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            flags+=(--verify-tag)
          else
            # A main push: the release tags this commit. A tag made with
            # the workflow token starts no other workflow.
            # An existing tag is fine only on this commit with no release
            # yet: a rerun after the release was deleted to retry
            # (docs/releasing.md). Otherwise another run published it.
            if tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha 2> /dev/null); then
              if [[ "$tagged" != "$GITHUB_SHA" ]] || gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
                echo "::notice::$TAG exists on ${tagged::12} and another run published it; nothing to do"
                echo "skipped=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              flags+=(--verify-tag)
            else
              flags+=(--target "$GITHUB_SHA")
            fi
          fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${flags[@]}"
      # Redeploy the site from main (pages.yml) now that this release's
      # binaries are downloadable, so it carries the release's version and
      # changelog.
      - name: Redeploy the site
        if: steps.publish.outputs.skipped != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

  # A main build: the archives replace the assets of the `main-build`
  # prerelease, so its download URLs never change. `--clobber` deletes
  # each asset before uploading its replacement, so a download during an
  # upload can 404 or fail its checksum; install.sh says to retry. Runs
  # queue rather than cancel, so an upload always finishes. The tag is moved to the build's commit when GitHub allows it:
  # GITHUB_TOKEN may not move a ref across commits that change workflow
  # files, and then the tag lags; the notes and the attestation name the
  # commit either way.
  main-build:
    if: github.ref == 'refs/heads/main' && needs.version.outputs.release != 'true'
    needs: [version, build, xcframework]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-main-build
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: main-build
      DISPLAY_VERSION: ${{ needs.version.outputs.display }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Combine checksums
        working-directory: dist
        run: |
          cat ./*.sha256 > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Update the main-build prerelease
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          The latest build of \`main\`, not a release: ganymede $DISPLAY_VERSION, built from $GITHUB_SHA. Each push to main replaces these files.

          \`\`\`sh
          curl -fsSL https://ganymede-server.com/install.sh | sh -s -- --main
          \`\`\`
          EOF
          # git/ref/ (singular) matches exactly; git/refs/ also matches prefixes.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true > /dev/null ||
              echo "::warning::could not move $TAG to $GITHUB_SHA; the assets are still updated"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # Archives before checksums: a download in between fails its
            # checksum rather than installing a mismatched pair.
            gh release upload "$TAG" dist/*.tar.gz dist/*.zip --repo "$GITHUB_REPOSITORY" --clobber
            gh release upload "$TAG" dist/*.sha256 dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md" --prerelease --latest=false
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Latest main build" --notes-file "$RUNNER_TEMP/notes.md" --prerelease --latest=false
          fi

  # The container image (container/Dockerfile, #203) with the release just
  # published, pushed to ghcr.io/tlockney/ganymede as the version and, for
  # a release that isn't a prerelease, `latest`, for amd64 and arm64. The
  # amd64 build is smoke-tested before anything is pushed.
  image:
    if: (github.ref_type == 'tag' || needs.version.outputs.release == 'true') && needs.release.outputs.skipped != 'true'
    needs: [version, release]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: container/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ganymede:test
          cache-to: type=gha,mode=max
      - run: container/smoke-test.sh ganymede:test
        timeout-minutes: 5
      - id: tags
        name: Image tags
        run: |
          {
            echo "tags<<EOF"
            echo "ghcr.io/tlockney/ganymede:$VERSION"
            [[ "$VERSION" == *-* ]] || echo "ghcr.io/tlockney/ganymede:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push (amd64, arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: container/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/tlockney/ganymede
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=MIT
