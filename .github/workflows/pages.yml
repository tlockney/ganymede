name: pages
# The site deploys what the latest release ships, not main: install.sh
# installs the latest release, so docs from main would describe commands
# users can't install yet. release.yml dispatches this workflow with the
# new tag once the release is published; a manual run deploys the latest
# release, or the given ref (to publish a docs fix between releases).
on:
  # Builds without deploying, so a broken docs page or dead link fails the PR
  # rather than the deploy.
  pull_request:
    paths: [site/**, docs/**, .github/workflows/pages.yml]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit to deploy (default: the latest release)"
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
env:
  # Where the site is served; config.mts derives the docs' base path from
  # it. Keep it in step with the custom domain in the Pages settings (an
  # Actions deployment ignores a CNAME file, so the settings are the only
  # place the domain lives).
  SITE_URL: https://ganymede-server.com
jobs:
  # The landing page is plain HTML and CSS in site/, served at /. The docs
  # are Markdown in docs/, built by VitePress into /docs/
  # (docs/.vitepress/config.mts). The design is cdp-kernel.org's.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Pick the ref to build
        id: ref
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
        run: |
          if [ -z "$REF" ]; then
            REF=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          fi
          test -n "$REF"
          echo "Deploying $REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ref.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - run: npm run build
        working-directory: docs
      - name: assemble
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cp -R site/. "$RUNNER_TEMP/site/"
          cp -R docs/.vitepress/dist "$RUNNER_TEMP/site/docs"
          cp -R docs/images "$RUNNER_TEMP/site/images"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      # Fetch the deployed site from SITE_URL: the landing page, a docs page,
      # the docs stylesheet that page links, and the install script. A base
      # path that doesn't match the domain makes the stylesheet 404.
      - name: smoke test
        run: |
          check() { curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o /dev/null "$1" && echo "ok $1"; }
          check "$SITE_URL/"
          check "$SITE_URL/install.sh"
          page=$(curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors "$SITE_URL/docs/install")
          css=$(printf '%s' "$page" | grep -o '/[^"]*/assets/style\.[^"]*\.css' | head -n 1)
          test -n "$css" || { echo "no stylesheet in $SITE_URL/docs/install"; exit 1; }
          check "$SITE_URL$css"
