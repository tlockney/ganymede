name: Tag release

# When a release PR from scripts/release.sh merges, main has a workspace
# version with a CHANGELOG.md section and no tag yet: tag the merge commit
# vX.Y.Z and run release.yml on it. A tag pushed with GITHUB_TOKEN starts
# no workflow by itself, so the release is dispatched explicitly.

on:
  push:
    branches: [main]
    paths: [Cargo.toml]
  # To retag after a failed release was untagged (docs/releasing.md). Run
  # on main only: it tags the head of the branch it runs on.
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag the version if it is new, and start the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          test -n "$version"
          tag="v$version"
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no $version section; not a release commit"
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag exists; nothing to do"
            exit 0
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          gh workflow run release.yml --ref "$tag"
          echo "Tagged $GITHUB_SHA as $tag and started release.yml"
