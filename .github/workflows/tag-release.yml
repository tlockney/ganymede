name: Tag release

# Recovery only: release.yml publishes a release from the main push of the
# release commit itself (#675). Run this on main to tag its head vX.Y.Z
# and start release.yml on the tag, after a release commit's own run
# could not publish (docs/releasing.md). A tag pushed with GITHUB_TOKEN
# starts no workflow by itself, so the release is dispatched explicitly.

on:
  # Run on main only: it tags the head of the branch it runs on.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Pushes the tag and dispatches release.yml.
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag the version if it is new, and start the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          test -n "$version"
          tag="v$version"
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no $version section; not a release commit"
            exit 0
          fi
          if tagged=$(git ls-remote --exit-code --tags origin "refs/tags/$tag" "refs/tags/$tag^{}"); then
            # A rerun after the tag was pushed but release.yml never
            # started: start it, unless it already ran or the tag is on
            # another commit. An annotated tag's commit is its `^{}` line.
            commit=$(echo "$tagged" | tail -n 1)
            if [[ "${commit%%[[:space:]]*}" != "$GITHUB_SHA" ]]; then
              echo "$tag exists on another commit; nothing to do"
              exit 0
            fi
            runs=$(gh run list --workflow release.yml --branch "$tag" --json databaseId --jq length)
            if gh release view "$tag" > /dev/null 2>&1 || [[ "$runs" != 0 ]]; then
              echo "$tag exists and release.yml has run for it; nothing to do"
              exit 0
            fi
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
          gh workflow run release.yml --ref "$tag"
          echo "Tagged $GITHUB_SHA as $tag and started release.yml"
