name: Review gate

# Passes only when an independent review has passed this PR's current
# commits: the reviewer adds the `review: pass` label, and a new push
# removes it, so every push needs a fresh review. Make `review-gate` a
# required check so an unreviewed PR can't merge. CLAUDE.md has the rules.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  pull-requests: write

concurrency:
  group: review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Drop the review label from earlier commits
        # A token from a fork can't edit labels; the reviewer drops it then.
        if: "github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'review: pass')"
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label "review: pass"
      - name: Require a passed review
        env:
          ACTION: ${{ github.event.action }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          PASSED: "${{ contains(github.event.pull_request.labels.*.name, 'review: pass') }}"
        run: |
          if [ "$AUTHOR" = "dependabot[bot]" ]; then
            echo "Dependabot PR: no review needed."
            exit 0
          fi
          if [ "$ACTION" != "synchronize" ] && [ "$PASSED" = "true" ]; then
            echo "Review passed for this commit."
            exit 0
          fi
          echo "::error::Waiting for an independent review. The reviewer adds the 'review: pass' label when this commit passes."
          exit 1
