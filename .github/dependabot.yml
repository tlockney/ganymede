# Weekly version bumps, grouped so each ecosystem opens one pull request a
# week at most. Security updates come as soon as an advisory is published,
# whatever this schedule says. Actions are pinned by commit SHA with the
# version in a comment; Dependabot updates both.
version: 2
updates:
  - package-ecosystem: cargo
    directories: ["/", "/e2e/wasm-smoke"]
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /container
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
    ignore:
      # Node and Rust version bumps go with ci.yml (node-version and the
      # linux-release container); only digests and patches come from here.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: rust
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: npm
    directories: ["/docs", "/validation"]
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # node-fetch 3 is ESM-only; validation/vscode.cjs needs require().
      - dependency-name: node-fetch
        update-types: ["version-update:semver-major"]
