<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 406" width="900" height="406" role="img" aria-label="What the install puts where. The ganymede binary goes in ~/.local/bin. It finds kernels in the Jupyter data dir (~/.local/share/jupyter, or ~/Library/Jupyter on macOS), where cdp-kernel install writes kernels/cdp-node/kernel.json and where notebook signatures are kept; that kernel.json&#x27;s argv starts cdp-kernel, installed with npm on Node 24 or later. ganymede lab install puts JupyterLab and its extensions in Ganymede&#x27;s data dir. The Jupyter config dir, ~/.jupyter, holds an optional ganymede.toml and JupyterLab&#x27;s settings and workspaces, and the runtime dir holds each running kernel&#x27;s connection file and the cookie secret.">
  <title>What the install puts where. The ganymede binary goes in ~/.local/bin. It finds kernels in the Jupyter data dir (~/.local/share/jupyter, or ~/Library/Jupyter on macOS), where cdp-kernel install writes kernels/cdp-node/kernel.json and where notebook signatures are kept; that kernel.json&#x27;s argv starts cdp-kernel, installed with npm on Node 24 or later. ganymede lab install puts JupyterLab and its extensions in Ganymede&#x27;s data dir. The Jupyter config dir, ~/.jupyter, holds an optional ganymede.toml and JupyterLab&#x27;s settings and workspaces, and the runtime dir holds each running kernel&#x27;s connection file and the cookie secret.</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f7f9; stroke: #9aa3ad; stroke-width: 1.2; }
    .inner { fill: #ffffff; stroke: #b8c0c8; stroke-width: 1; }
    .acc { fill: #e8f0fe; stroke: #3b6fd8; stroke-width: 1.4; }
    .warn { fill: #fdf0e6; stroke: #c96a1b; stroke-width: 1.4; }
    .ok { fill: #e7f5ec; stroke: #2f8a4c; stroke-width: 1.4; }
    .dash { stroke-dasharray: 5 4; }
    .warnpill { fill: #c96a1b; }
    .tw { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #ffffff; }
    .t { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1f2328; }
    .s { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #4b535d; }
    .m { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; }
    .l { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #4b535d; }
    .ln { stroke: #6e7781; stroke-width: 1.4; fill: none; }
    .life { stroke: #9aa3ad; stroke-width: 1; stroke-dasharray: 4 4; fill: none; }
    .hl { stroke: #3b6fd8; stroke-width: 1.6; fill: none; }
    .ah { fill: #6e7781; }
    .ahb { fill: #3b6fd8; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1b1b1f; }
      .box { fill: #25262b; stroke: #5c6370; }
      .inner { fill: #1b1b1f; stroke: #4a505a; }
      .acc { fill: #1e2a44; stroke: #6b9bff; }
      .warn { fill: #3a2a1c; stroke: #e0904a; }
      .ok { fill: #1d3326; stroke: #5cc27e; }
      .warnpill { fill: #e0904a; }
      .tw { fill: #1b1b1f; }
      .t, .m { fill: #e6e8eb; }
      .s, .l { fill: #b6bcc4; }
      .ln { stroke: #a0a7b0; }
      .life { stroke: #5c6370; }
      .hl { stroke: #6b9bff; }
      .ah { fill: #a0a7b0; }
      .ahb { fill: #6b9bff; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ahb" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="900" height="406" rx="8"/>
  <rect class="ok" x="20" y="174" width="170" height="64" rx="6"/>
  <rect class="box" x="370" y="20" width="320" height="94" rx="6"/>
  <text class="t" x="382" y="40">Jupyter data dir</text>
  <text class="l" x="678" y="40" text-anchor="end">step 2</text>
  <text class="l" x="382" y="56">~/.local/share/jupyter</text>
  <text class="l" x="382" y="71">~/Library/Jupyter (macOS)</text>
  <text class="m" x="382" y="90">kernels/cdp-node/kernel.json</text>
  <text class="m" x="382" y="106">notebook_secret, nbsignatures.db</text>
  <line class="ln" x1="210" y1="67" x2="368" y2="67" marker-end="url(#a)"/>
  <text class="l" x="218" y="61">finds kernels; signs</text>
  <rect class="box" x="370" y="126" width="320" height="78" rx="6"/>
  <text class="t" x="382" y="146">Ganymede data dir</text>
  <text class="l" x="678" y="146" text-anchor="end">step 4</text>
  <text class="l" x="382" y="162">~/.local/share/ganymede</text>
  <text class="l" x="382" y="177">~/Library/Application Support/ganymede</text>
  <text class="m" x="382" y="196">lab/4.6.4/, labextensions/</text>
  <line class="ln" x1="210" y1="165" x2="368" y2="165" marker-end="url(#a)"/>
  <text class="l" x="218" y="159">serves JupyterLab from</text>
  <rect class="box" x="370" y="216" width="320" height="79" rx="6"/>
  <text class="t" x="382" y="236">Jupyter config dir</text>
  <text class="l" x="382" y="252">~/.jupyter</text>
  <text class="m" x="382" y="271">ganymede.toml, if you write one</text>
  <text class="m" x="382" y="287">lab/user-settings/, lab/workspaces/</text>
  <line class="ln" x1="210" y1="255" x2="368" y2="255" marker-end="url(#a)"/>
  <text class="l" x="218" y="249">reads config; keeps settings</text>
  <rect class="box" x="370" y="307" width="320" height="79" rx="6"/>
  <text class="t" x="382" y="327">Jupyter runtime dir</text>
  <text class="l" x="382" y="343">&lt;data dir&gt;/runtime</text>
  <text class="m" x="382" y="362">kernel-&lt;id&gt;.json for each kernel</text>
  <text class="m" x="382" y="378">jupyter_cookie_secret</text>
  <line class="ln" x1="210" y1="346" x2="368" y2="346" marker-end="url(#a)"/>
  <text class="l" x="218" y="340">writes while running</text>
  <line class="ln" x1="210" y1="67" x2="210" y2="346"/>
  <line class="ln" x1="190" y1="206" x2="210" y2="206"/>
  <text class="m" x="32" y="196">ganymede</text>
  <text class="l" x="32" y="214">~/.local/bin, step 1</text>
  <text class="l" x="32" y="228">one file, no dependencies</text>
  <rect class="acc" x="750" y="27" width="134" height="80" rx="6"/>
  <text class="m" x="760" y="49">cdp-kernel</text>
  <text class="l" x="760" y="67">npm install -g, step 2</text>
  <text class="l" x="760" y="83">on Node 24 or later</text>
  <text class="l" x="760" y="98">(or any other kernel)</text>
  <line class="hl" x1="692" y1="67" x2="748" y2="67" marker-end="url(#b)"/>
  <text class="l" x="720" y="61" text-anchor="middle">starts</text>
</svg>
