<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 304" width="900" height="304" role="img" aria-label="Running kernels on another server. On your machine, a frontend talks to ganymede serve started with --gateway-url, which answers contents, sessions and trust from the notebook folder. For kernelspecs and kernels it calls the kernel server&#x27;s REST API (kernelspecs, start, interrupt, restart, shut down) and relays each kernel&#x27;s messages over its websocket. The kernel server, jupyter server or ganymede serve, runs the kernel processes over ZeroMQ.">
  <title>Running kernels on another server. On your machine, a frontend talks to ganymede serve started with --gateway-url, which answers contents, sessions and trust from the notebook folder. For kernelspecs and kernels it calls the kernel server&#x27;s REST API (kernelspecs, start, interrupt, restart, shut down) and relays each kernel&#x27;s messages over its websocket. The kernel server, jupyter server or ganymede serve, runs the kernel processes over ZeroMQ.</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f7f9; stroke: #9aa3ad; stroke-width: 1.2; }
    .inner { fill: #ffffff; stroke: #b8c0c8; stroke-width: 1; }
    .acc { fill: #e8f0fe; stroke: #3b6fd8; stroke-width: 1.4; }
    .warn { fill: #fdf0e6; stroke: #c96a1b; stroke-width: 1.4; }
    .ok { fill: #e7f5ec; stroke: #2f8a4c; stroke-width: 1.4; }
    .dash { stroke-dasharray: 5 4; }
    .warnpill { fill: #c96a1b; }
    .tw { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #ffffff; }
    .t { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1f2328; }
    .s { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #4b535d; }
    .m { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; }
    .l { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #4b535d; }
    .ln { stroke: #6e7781; stroke-width: 1.4; fill: none; }
    .life { stroke: #9aa3ad; stroke-width: 1; stroke-dasharray: 4 4; fill: none; }
    .hl { stroke: #3b6fd8; stroke-width: 1.6; fill: none; }
    .ah { fill: #6e7781; }
    .ahb { fill: #3b6fd8; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1b1b1f; }
      .box { fill: #25262b; stroke: #5c6370; }
      .inner { fill: #1b1b1f; stroke: #4a505a; }
      .acc { fill: #1e2a44; stroke: #6b9bff; }
      .warn { fill: #3a2a1c; stroke: #e0904a; }
      .ok { fill: #1d3326; stroke: #5cc27e; }
      .warnpill { fill: #e0904a; }
      .tw { fill: #1b1b1f; }
      .t, .m { fill: #e6e8eb; }
      .s, .l { fill: #b6bcc4; }
      .ln { stroke: #a0a7b0; }
      .life { stroke: #5c6370; }
      .hl { stroke: #6b9bff; }
      .ah { fill: #a0a7b0; }
      .ahb { fill: #6b9bff; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ahb" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="900" height="304" rx="8"/>
  <rect class="box" x="20" y="20" width="420" height="250" rx="6"/>
  <text class="t" x="34" y="42">Your machine: notebooks and files</text>
  <rect class="box" x="620" y="20" width="260" height="250" rx="6"/>
  <text class="t" x="634" y="42">Kernel server: kernels</text>
  <rect class="acc" x="40" y="70" width="170" height="56" rx="4"/>
  <text class="m" x="52" y="92">A frontend</text>
  <text class="l" x="52" y="110">JupyterLab, VS Code, ui</text>
  <rect class="ok" x="250" y="70" width="170" height="180" rx="4"/>
  <text class="m" x="262" y="92">ganymede serve</text>
  <text class="l" x="262" y="108">--gateway-url</text>
  <text class="l" x="262" y="136">contents, sessions,</text>
  <text class="l" x="262" y="151">trust: answered here</text>
  <text class="l" x="262" y="179">kernelspecs, kernels:</text>
  <text class="l" x="262" y="194">passed to the server</text>
  <rect class="inner" x="40" y="160" width="170" height="56" rx="4"/>
  <text class="m" x="52" y="182">Notebook folder</text>
  <text class="l" x="52" y="200">--root-dir</text>
  <line class="ln" x1="212" y1="98" x2="248" y2="98" marker-start="url(#a)" marker-end="url(#a)"/>
  <line class="ln" x1="248" y1="188" x2="212" y2="188" marker-end="url(#a)"/>
  <rect class="ok" x="640" y="70" width="220" height="90" rx="4"/>
  <text class="m" x="652" y="92">Jupyter or Ganymede</text>
  <text class="m" x="652" y="108">server</text>
  <text class="l" x="652" y="128">jupyter server, or</text>
  <text class="l" x="652" y="143">ganymede serve</text>
  <rect class="inner" x="640" y="194" width="220" height="56" rx="4"/>
  <text class="m" x="652" y="216">Kernel processes</text>
  <text class="l" x="652" y="234">its kernelspecs</text>
  <line class="ln" x1="750" y1="162" x2="750" y2="192" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="l" x="760" y="181">ZeroMQ</text>
  <line class="hl" x1="422" y1="96" x2="638" y2="96" marker-start="url(#b)" marker-end="url(#b)"/>
  <text class="l" x="530" y="72" text-anchor="middle">REST: kernelspecs, start,</text>
  <text class="l" x="530" y="87" text-anchor="middle">interrupt, restart, shut down</text>
  <line class="hl" x1="422" y1="134" x2="638" y2="134" marker-start="url(#b)" marker-end="url(#b)"/>
  <text class="l" x="530" y="152" text-anchor="middle">websocket: each kernel&#x27;s</text>
  <text class="l" x="530" y="167" text-anchor="middle">messages, both ways</text>
  <text class="l" x="34" y="290">--gateway-token is the kernel server&#x27;s token. Kernelspecs refresh every minute; HTTPS is checked against the system&#x27;s trust store.</text>
</svg>
