<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 612" width="920" height="612" role="img" aria-label="Where each piece runs in four setups, by role: notebook UI, Ganymede, kernels and notebooks. On a workstation or server, a frontend in a browser, ganymede serve, and each kernel are separate processes, and notebooks are the served folder. In the Mac app, ganymede-ui and Ganymede both run inside the app, and kernels are the Mac&#x27;s own processes, or a kernel server. In the iPad app, everything runs inside the app: Ganymede serves files only, and cdp-kernel runs in a Worker in the page, unless a kernel server is set. In any browser, there is no server: ganymede-ui, its kernels and its IndexedDB storage all stay in one tab.">
  <title>Where each piece runs in four setups, by role: notebook UI, Ganymede, kernels and notebooks. On a workstation or server, a frontend in a browser, ganymede serve, and each kernel are separate processes, and notebooks are the served folder. In the Mac app, ganymede-ui and Ganymede both run inside the app, and kernels are the Mac&#x27;s own processes, or a kernel server. In the iPad app, everything runs inside the app: Ganymede serves files only, and cdp-kernel runs in a Worker in the page, unless a kernel server is set. In any browser, there is no server: ganymede-ui, its kernels and its IndexedDB storage all stay in one tab.</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f7f9; stroke: #9aa3ad; stroke-width: 1.2; }
    .inner { fill: #ffffff; stroke: #b8c0c8; stroke-width: 1; }
    .acc { fill: #e8f0fe; stroke: #3b6fd8; stroke-width: 1.4; }
    .warn { fill: #fdf0e6; stroke: #c96a1b; stroke-width: 1.4; }
    .ok { fill: #e7f5ec; stroke: #2f8a4c; stroke-width: 1.4; }
    .dash { stroke-dasharray: 5 4; }
    .t { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1f2328; }
    .s { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
    .m { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; }
    .l { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
    .ln { stroke: #6e7781; stroke-width: 1.4; fill: none; }
    .life { stroke: #9aa3ad; stroke-width: 1; stroke-dasharray: 4 4; fill: none; }
    .hl { stroke: #3b6fd8; stroke-width: 1.6; fill: none; }
    .ah { fill: #6e7781; }
    .ahb { fill: #3b6fd8; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1b1b1f; }
      .box { fill: #25262b; stroke: #5c6370; }
      .inner { fill: #1b1b1f; stroke: #4a505a; }
      .acc { fill: #1e2a44; stroke: #6b9bff; }
      .warn { fill: #3a2a1c; stroke: #e0904a; }
      .ok { fill: #1d3326; stroke: #5cc27e; }
      .t, .m { fill: #e6e8eb; }
      .s, .l { fill: #a0a7b0; }
      .ln { stroke: #a0a7b0; }
      .life { stroke: #5c6370; }
      .hl { stroke: #6b9bff; }
      .ah { fill: #a0a7b0; }
      .ahb { fill: #6b9bff; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ahb" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="920" height="612" rx="8"/>
  <text class="t" x="295" y="36" text-anchor="middle">Notebook UI</text>
  <text class="t" x="475" y="36" text-anchor="middle">Ganymede</text>
  <text class="t" x="655" y="36" text-anchor="middle">Kernels</text>
  <text class="t" x="830" y="36" text-anchor="middle">Notebooks</text>
  <rect class="box" x="12" y="52" width="896" height="122" rx="6"/>
  <text class="t" x="26" y="82">Workstation or server</text>
  <text class="s" x="26" y="104">Ganymede and every kernel</text>
  <text class="s" x="26" y="120">are separate processes.</text>
  <rect class="acc" x="220" y="80" width="150" height="54" rx="4"/>
  <text class="m" x="230" y="98">A frontend</text>
  <text class="l" x="230" y="114">JupyterLab, VS Code,</text>
  <text class="l" x="230" y="127">or ganymede-ui</text>
  <rect class="inner" x="400" y="80" width="150" height="54" rx="4"/>
  <text class="m" x="410" y="98">ganymede serve</text>
  <text class="l" x="410" y="114">its own process</text>
  <rect class="inner" x="580" y="80" width="150" height="54" rx="4"/>
  <text class="m" x="590" y="98">Kernel processes</text>
  <text class="l" x="590" y="114">launched from the</text>
  <text class="l" x="590" y="127">installed kernelspecs</text>
  <rect class="box" x="760" y="80" width="140" height="54" rx="4"/>
  <text class="m" x="770" y="98">Folder served</text>
  <text class="l" x="770" y="114">--root-dir</text>
  <line class="ln" x1="372" y1="107" x2="398" y2="107" marker-start="url(#a)" marker-end="url(#a)"/>
  <line class="ln" x1="552" y1="107" x2="578" y2="107" marker-start="url(#a)" marker-end="url(#a)"/>
  <path class="ln" d="M475,78 V72 H830 V78" marker-end="url(#a)"/>
  <rect class="box" x="12" y="184" width="896" height="122" rx="6"/>
  <text class="t" x="26" y="214">Mac app</text>
  <text class="s" x="26" y="236">Ganymede runs inside the</text>
  <text class="s" x="26" y="252">app; kernels are the Mac&#x27;s.</text>
  <rect class="hl dash" x="210" y="192" width="350" height="106" rx="6"/>
  <text class="l" x="218" y="205">Inside the app</text>
  <rect class="acc" x="220" y="212" width="150" height="54" rx="4"/>
  <text class="m" x="230" y="230">ganymede-ui</text>
  <text class="l" x="230" y="246">in the app&#x27;s web view</text>
  <rect class="warn" x="400" y="212" width="150" height="54" rx="4"/>
  <text class="m" x="410" y="230">Ganymede</text>
  <text class="l" x="410" y="246">inside the app,</text>
  <text class="l" x="410" y="259">via ganymede-ffi</text>
  <rect class="inner" x="580" y="212" width="150" height="54" rx="4"/>
  <text class="m" x="590" y="230">Kernel processes</text>
  <text class="l" x="590" y="246">the Mac&#x27;s kernelspecs,</text>
  <text class="l" x="590" y="259">or a kernel server</text>
  <rect class="box" x="760" y="212" width="140" height="54" rx="4"/>
  <text class="m" x="770" y="230">Folder you pick</text>
  <text class="l" x="770" y="246">File › Open Folder</text>
  <line class="ln" x1="372" y1="239" x2="398" y2="239" marker-start="url(#a)" marker-end="url(#a)"/>
  <line class="ln" x1="552" y1="239" x2="578" y2="239" marker-start="url(#a)" marker-end="url(#a)"/>
  <path class="ln" d="M475,210 V204 H830 V210" marker-end="url(#a)"/>
  <rect class="box" x="12" y="316" width="896" height="122" rx="6"/>
  <text class="t" x="26" y="346">iPad app</text>
  <text class="s" x="26" y="368">iOS can&#x27;t launch processes,</text>
  <text class="s" x="26" y="384">so the kernel runs in the page.</text>
  <rect class="hl dash" x="210" y="324" width="530" height="106" rx="6"/>
  <text class="l" x="218" y="337">Inside the app</text>
  <rect class="acc" x="220" y="344" width="150" height="54" rx="4"/>
  <text class="m" x="230" y="362">ganymede-ui</text>
  <text class="l" x="230" y="378">in the app&#x27;s web view</text>
  <rect class="warn" x="400" y="344" width="150" height="54" rx="4"/>
  <text class="m" x="410" y="362">Ganymede</text>
  <text class="l" x="410" y="378">inside the app;</text>
  <text class="l" x="410" y="391">files only</text>
  <rect class="acc" x="580" y="344" width="150" height="54" rx="4"/>
  <text class="m" x="590" y="362">cdp-kernel</text>
  <text class="l" x="590" y="378">in a Worker in the page,</text>
  <text class="l" x="590" y="391">or a kernel server</text>
  <rect class="box" x="760" y="344" width="140" height="54" rx="4"/>
  <text class="m" x="770" y="362">Documents</text>
  <text class="l" x="770" y="378">or iCloud Drive</text>
  <line class="ln" x1="372" y1="371" x2="398" y2="371" marker-start="url(#a)" marker-end="url(#a)"/>
  <path class="hl" d="M295,400 V412 H655 V400" marker-start="url(#b)" marker-end="url(#b)"/>
  <text class="l" x="475" y="425" text-anchor="middle">kernel messages stay in the page</text>
  <path class="ln" d="M475,342 V336 H830 V342" marker-end="url(#a)"/>
  <rect class="box" x="12" y="448" width="896" height="122" rx="6"/>
  <text class="t" x="26" y="478">Any browser</text>
  <text class="s" x="26" y="500">No server: notebooks and</text>
  <text class="s" x="26" y="516">kernels stay in the tab.</text>
  <rect class="hl dash" x="210" y="456" width="700" height="106" rx="6"/>
  <text class="l" x="218" y="469">Inside one browser tab</text>
  <rect class="acc" x="220" y="476" width="150" height="54" rx="4"/>
  <text class="m" x="230" y="494">ganymede-ui</text>
  <text class="l" x="230" y="510">in a browser tab</text>
  <rect class="inner dash" x="400" y="476" width="150" height="54" rx="4"/>
  <text class="m" x="410" y="494">No server</text>
  <rect class="acc" x="580" y="476" width="150" height="54" rx="4"/>
  <text class="m" x="590" y="494">cdp-kernel or JS</text>
  <text class="l" x="590" y="510">in a Worker in the page</text>
  <rect class="acc" x="760" y="476" width="140" height="54" rx="4"/>
  <text class="m" x="770" y="494">IndexedDB</text>
  <text class="l" x="770" y="510">the browser&#x27;s storage</text>
  <path class="hl" d="M295,532 V544 H655 V532" marker-start="url(#b)" marker-end="url(#b)"/>
  <text class="l" x="475" y="557" text-anchor="middle">kernel messages stay in the page</text>
  <rect class="acc" x="26" y="586" width="16" height="12" rx="2"/>
  <text class="l" x="48" y="596">in a web page</text>
  <rect class="warn" x="176" y="586" width="16" height="12" rx="2"/>
  <text class="l" x="198" y="596">inside the app</text>
  <rect class="inner" x="326" y="586" width="16" height="12" rx="2"/>
  <text class="l" x="348" y="596">its own process</text>
  <rect class="box" x="476" y="586" width="16" height="12" rx="2"/>
  <text class="l" x="498" y="596">files and storage</text>
</svg>
