<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" role="img" aria-label="Running a cell. Client A sends execute_request on the websocket; Ganymede notes A&#x27;s session and sends it to the kernel on shell. The kernel publishes status busy, execute_input, outputs and status idle on iopub, and Ganymede passes each to every client, A and B. The kernel&#x27;s execute_reply comes back on shell, before or after idle, and goes only to A. A&#x27;s request is done when it has both the reply and the idle.">
  <title>Running a cell. Client A sends execute_request on the websocket; Ganymede notes A&#x27;s session and sends it to the kernel on shell. The kernel publishes status busy, execute_input, outputs and status idle on iopub, and Ganymede passes each to every client, A and B. The kernel&#x27;s execute_reply comes back on shell, before or after idle, and goes only to A. A&#x27;s request is done when it has both the reply and the idle.</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f7f9; stroke: #9aa3ad; stroke-width: 1.2; }
    .inner { fill: #ffffff; stroke: #b8c0c8; stroke-width: 1; }
    .acc { fill: #e8f0fe; stroke: #3b6fd8; stroke-width: 1.4; }
    .warn { fill: #fdf0e6; stroke: #c96a1b; stroke-width: 1.4; }
    .ok { fill: #e7f5ec; stroke: #2f8a4c; stroke-width: 1.4; }
    .dash { stroke-dasharray: 5 4; }
    .t { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1f2328; }
    .s { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
    .m { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; }
    .l { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
    .ln { stroke: #6e7781; stroke-width: 1.4; fill: none; }
    .life { stroke: #9aa3ad; stroke-width: 1; stroke-dasharray: 4 4; fill: none; }
    .hl { stroke: #3b6fd8; stroke-width: 1.6; fill: none; }
    .ah { fill: #6e7781; }
    .ahb { fill: #3b6fd8; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1b1b1f; }
      .box { fill: #25262b; stroke: #5c6370; }
      .inner { fill: #1b1b1f; stroke: #4a505a; }
      .acc { fill: #1e2a44; stroke: #6b9bff; }
      .warn { fill: #3a2a1c; stroke: #e0904a; }
      .ok { fill: #1d3326; stroke: #5cc27e; }
      .t, .m { fill: #e6e8eb; }
      .s, .l { fill: #a0a7b0; }
      .ln { stroke: #a0a7b0; }
      .life { stroke: #5c6370; }
      .hl { stroke: #6b9bff; }
      .ah { fill: #a0a7b0; }
      .ahb { fill: #6b9bff; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ahb" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="860" height="430" rx="8"/>
  <rect class="acc" x="30" y="20" width="160" height="44" rx="4"/>
  <text class="t" x="110" y="39" text-anchor="middle">Client A</text>
  <text class="l" x="110" y="55" text-anchor="middle">runs the cell</text>
  <line class="life" x1="110" y1="64" x2="110" y2="410"/>
  <rect class="ok" x="310" y="20" width="160" height="44" rx="4"/>
  <text class="t" x="390" y="39" text-anchor="middle">Ganymede</text>
  <text class="l" x="390" y="55" text-anchor="middle">server, api, kernel-host</text>
  <line class="life" x1="390" y1="64" x2="390" y2="410"/>
  <rect class="inner" x="510" y="20" width="160" height="44" rx="4"/>
  <text class="t" x="590" y="39" text-anchor="middle">Client B</text>
  <text class="l" x="590" y="55" text-anchor="middle">same kernel, another tab</text>
  <line class="life" x1="590" y1="64" x2="590" y2="410"/>
  <rect class="box" x="690" y="20" width="160" height="44" rx="4"/>
  <text class="t" x="770" y="39" text-anchor="middle">Kernel</text>
  <text class="l" x="770" y="55" text-anchor="middle">any kernelspec</text>
  <line class="life" x1="770" y1="64" x2="770" y2="410"/>
  <line class="ln" x1="110" y1="100" x2="388" y2="100" marker-end="url(#a)"/>
  <text class="s" x="250.0" y="94" text-anchor="middle">execute_request, on the websocket</text>
  <line class="ln" x1="390" y1="134" x2="768" y2="134" marker-end="url(#a)"/>
  <text class="s" x="398" y="128" text-anchor="start">shell: execute_request (the client&#x27;s session is noted)</text>
  <line class="ln" x1="770" y1="172" x2="392" y2="172" marker-end="url(#a)"/>
  <text class="s" x="762" y="166" text-anchor="end">iopub: status busy, execute_input</text>
  <line class="ln" x1="770" y1="202" x2="392" y2="202" marker-end="url(#a)"/>
  <text class="s" x="762" y="196" text-anchor="end">iopub: stream, display_data, execute_result</text>
  <line class="ln" x1="770" y1="232" x2="392" y2="232" marker-end="url(#a)"/>
  <text class="s" x="762" y="226" text-anchor="end">iopub: status idle</text>
  <line class="ln" x1="390" y1="270" x2="112" y2="270" marker-end="url(#a)"/>
  <text class="s" x="250.0" y="264" text-anchor="middle">each iopub message</text>
  <line class="ln" x1="390" y1="270" x2="588" y2="270" marker-end="url(#a)"/>
  <text class="s" x="490.0" y="264" text-anchor="middle">to every client</text>
  <line class="hl" x1="770" y1="310" x2="392" y2="310" marker-end="url(#b)"/>
  <text class="s" x="762" y="304" text-anchor="end">shell: execute_reply (before or after idle)</text>
  <line class="hl" x1="390" y1="344" x2="112" y2="344" marker-end="url(#b)"/>
  <text class="s" x="250.0" y="338" text-anchor="middle">execute_reply: only to the client that asked</text>
  <rect class="acc" x="30" y="364" width="520" height="44" rx="4"/>
  <text class="s" x="44" y="382">Client A&#x27;s request is done when it has both the execute_reply and the</text>
  <text class="s" x="44" y="398">status idle whose parent is the request. The two come on different sockets.</text>
</svg>
