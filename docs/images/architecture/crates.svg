<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 524" width="1000" height="524" role="img" aria-label="Ganymede&#x27;s crates and what each uses. ganymede-ffi and ganymede-cli sit on top: the ffi uses the server; the cli uses the server and the engine. The server uses terminals, api, lsp, gateway, exec and documents; the engine uses exec. api uses contents and kernel-host; lsp, gateway and exec use kernel-host; exec also uses nbformat. kernel-host uses protocol; contents and documents use nbformat. documents, protocol and nbformat, at the bottom, do no I/O.">
  <title>Ganymede&#x27;s crates and what each uses. ganymede-ffi and ganymede-cli sit on top: the ffi uses the server; the cli uses the server and the engine. The server uses terminals, api, lsp, gateway, exec and documents; the engine uses exec. api uses contents and kernel-host; lsp, gateway and exec use kernel-host; exec also uses nbformat. kernel-host uses protocol; contents and documents use nbformat. documents, protocol and nbformat, at the bottom, do no I/O.</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f7f9; stroke: #9aa3ad; stroke-width: 1.2; }
    .inner { fill: #ffffff; stroke: #b8c0c8; stroke-width: 1; }
    .acc { fill: #e8f0fe; stroke: #3b6fd8; stroke-width: 1.4; }
    .warn { fill: #fdf0e6; stroke: #c96a1b; stroke-width: 1.4; }
    .ok { fill: #e7f5ec; stroke: #2f8a4c; stroke-width: 1.4; }
    .dash { stroke-dasharray: 5 4; }
    .warnpill { fill: #c96a1b; }
    .tw { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #ffffff; }
    .t { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1f2328; }
    .s { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #4b535d; }
    .m { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; }
    .l { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #4b535d; }
    .ln { stroke: #6e7781; stroke-width: 1.4; fill: none; }
    .life { stroke: #9aa3ad; stroke-width: 1; stroke-dasharray: 4 4; fill: none; }
    .hl { stroke: #3b6fd8; stroke-width: 1.6; fill: none; }
    .ah { fill: #6e7781; }
    .ahb { fill: #3b6fd8; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1b1b1f; }
      .box { fill: #25262b; stroke: #5c6370; }
      .inner { fill: #1b1b1f; stroke: #4a505a; }
      .acc { fill: #1e2a44; stroke: #6b9bff; }
      .warn { fill: #3a2a1c; stroke: #e0904a; }
      .ok { fill: #1d3326; stroke: #5cc27e; }
      .warnpill { fill: #e0904a; }
      .tw { fill: #1b1b1f; }
      .t, .m { fill: #e6e8eb; }
      .s, .l { fill: #b6bcc4; }
      .ln { stroke: #a0a7b0; }
      .life { stroke: #5c6370; }
      .hl { stroke: #6b9bff; }
      .ah { fill: #a0a7b0; }
      .ahb { fill: #6b9bff; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ahb" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1000" height="524" rx="8"/>
  <text class="t" x="36" y="34">Crates: arrows point to what a crate uses</text>
  <text class="l" x="964" y="34" text-anchor="end">dependencies implied by another arrow are left out</text>
  <rect class="ok" x="12" y="406" width="976" height="76" rx="6"/>
  <text class="t" x="28" y="436">No I/O</text>
  <text class="l" x="28" y="454">builds for</text>
  <text class="l" x="28" y="468">any target</text>
  <line class="ln" x1="255" y1="108" x2="340" y2="150" marker-end="url(#a)"/>
  <line class="ln" x1="605" y1="108" x2="340" y2="150" marker-end="url(#a)"/>
  <line class="ln" x1="605" y1="108" x2="785" y2="150" marker-end="url(#a)"/>
  <line class="ln" x1="340" y1="198" x2="105" y2="240" marker-end="url(#a)"/>
  <line class="ln" x1="340" y1="198" x2="290" y2="240" marker-end="url(#a)"/>
  <line class="ln" x1="340" y1="198" x2="475" y2="240" marker-end="url(#a)"/>
  <line class="ln" x1="340" y1="198" x2="660" y2="240" marker-end="url(#a)"/>
  <line class="ln" x1="425" y1="190" x2="845" y2="240" marker-end="url(#a)"/>
  <line class="ln" x1="785" y1="198" x2="845" y2="240" marker-end="url(#a)"/>
  <line class="ln" x1="290" y1="288" x2="105" y2="330" marker-end="url(#a)"/>
  <line class="ln" x1="290" y1="288" x2="475" y2="330" marker-end="url(#a)"/>
  <line class="ln" x1="475" y1="288" x2="475" y2="330" marker-end="url(#a)"/>
  <line class="ln" x1="660" y1="288" x2="475" y2="330" marker-end="url(#a)"/>
  <line class="ln" x1="845" y1="288" x2="475" y2="330" marker-end="url(#a)"/>
  <line class="ln" x1="845" y1="288" x2="745" y2="418" marker-end="url(#a)"/>
  <line class="ln" x1="475" y1="378" x2="475" y2="418" marker-end="url(#a)"/>
  <path class="ln" d="M255,186 H198 V398 H255 V418" marker-end="url(#a)"/>
  <path class="ln" d="M105,378 V510 H705 V470" marker-end="url(#a)"/>
  <path class="ln" d="M255,468 V494 H685 V470" marker-end="url(#a)"/>
  <rect class="acc" x="170" y="60" width="170" height="48" rx="4"/>
  <text class="m" x="180" y="80">ganymede-ffi</text>
  <text class="l" x="180" y="96">C ABI for apps</text>
  <rect class="acc" x="520" y="60" width="170" height="48" rx="4"/>
  <text class="m" x="530" y="80">ganymede-cli</text>
  <text class="l" x="530" y="96">the ganymede command</text>
  <rect class="inner" x="255" y="150" width="170" height="48" rx="4"/>
  <text class="m" x="265" y="170">ganymede-server</text>
  <text class="l" x="265" y="186">HTTP, websocket, auth</text>
  <rect class="inner" x="700" y="150" width="170" height="48" rx="4"/>
  <text class="m" x="710" y="170">ganymede-engine</text>
  <text class="l" x="710" y="186">library to embed</text>
  <rect class="inner" x="20" y="240" width="170" height="48" rx="4"/>
  <text class="m" x="30" y="260">ganymede-terminals</text>
  <text class="l" x="30" y="276">shells in a pty</text>
  <rect class="inner" x="205" y="240" width="170" height="48" rx="4"/>
  <text class="m" x="215" y="260">ganymede-api</text>
  <text class="l" x="215" y="276">kernel, session managers</text>
  <rect class="inner" x="390" y="240" width="170" height="48" rx="4"/>
  <text class="m" x="400" y="260">ganymede-lsp</text>
  <text class="l" x="400" y="276">language servers</text>
  <rect class="inner" x="575" y="240" width="170" height="48" rx="4"/>
  <text class="m" x="585" y="260">ganymede-gateway</text>
  <text class="l" x="585" y="276">remote kernels</text>
  <rect class="inner" x="760" y="240" width="170" height="48" rx="4"/>
  <text class="m" x="770" y="260">ganymede-exec</text>
  <text class="l" x="770" y="276">runs notebooks</text>
  <rect class="inner" x="20" y="330" width="170" height="48" rx="4"/>
  <text class="m" x="30" y="350">ganymede-contents</text>
  <text class="l" x="30" y="366">files, checkpoints, trust</text>
  <rect class="inner" x="390" y="330" width="170" height="48" rx="4"/>
  <text class="m" x="400" y="350">ganymede-kernel-host</text>
  <text class="l" x="400" y="366">kernelspecs, launch</text>
  <rect class="inner" x="170" y="420" width="170" height="48" rx="4"/>
  <text class="m" x="180" y="440">ganymede-documents</text>
  <text class="l" x="180" y="456">rooms: yrs, merge</text>
  <rect class="inner" x="390" y="420" width="170" height="48" rx="4"/>
  <text class="m" x="400" y="440">ganymede-protocol</text>
  <text class="l" x="400" y="456">messages, wire, HMAC</text>
  <rect class="inner" x="640" y="420" width="170" height="48" rx="4"/>
  <text class="m" x="650" y="440">ganymede-nbformat</text>
  <text class="l" x="650" y="456">read, byte-exact write</text>
</svg>
