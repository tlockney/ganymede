<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="An agent journaling into a notebook. A coding agent such as Claude Code runs nb (nb-cli), which adds and edits cells through ganymede serve's contents API and runs them through the kernel websocket. ganymede serve writes the notebook file in the root dir and keeps one kernel per notebook, so state carries across nb execute calls. You open the same notebook in JupyterLab, VS Code or ganymede-ui and see the agent's cells after a reload.">
  <title>An agent journaling into a notebook. A coding agent such as Claude Code runs nb (nb-cli), which adds and edits cells through ganymede serve's contents API and runs them through the kernel websocket. ganymede serve writes the notebook file in the root dir and keeps one kernel per notebook, so state carries across nb execute calls. You open the same notebook in JupyterLab, VS Code or ganymede-ui and see the agent's cells after a reload.</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f7f9; stroke: #9aa3ad; stroke-width: 1.2; }
    .inner { fill: #ffffff; stroke: #b8c0c8; stroke-width: 1; }
    .acc { fill: #e8f0fe; stroke: #3b6fd8; stroke-width: 1.4; }
    .warn { fill: #fdf0e6; stroke: #c96a1b; stroke-width: 1.4; }
    .ok { fill: #e7f5ec; stroke: #2f8a4c; stroke-width: 1.4; }
    .dash { stroke-dasharray: 5 4; }
    .warnpill { fill: #c96a1b; }
    .tw { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #ffffff; }
    .t { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1f2328; }
    .s { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #4b535d; }
    .m { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; }
    .l { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #4b535d; }
    .ln { stroke: #6e7781; stroke-width: 1.4; fill: none; }
    .life { stroke: #9aa3ad; stroke-width: 1; stroke-dasharray: 4 4; fill: none; }
    .hl { stroke: #3b6fd8; stroke-width: 1.6; fill: none; }
    .ah { fill: #6e7781; }
    .ahb { fill: #3b6fd8; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1b1b1f; }
      .box { fill: #25262b; stroke: #5c6370; }
      .inner { fill: #1b1b1f; stroke: #4a505a; }
      .acc { fill: #1e2a44; stroke: #6b9bff; }
      .warn { fill: #3a2a1c; stroke: #e0904a; }
      .ok { fill: #1d3326; stroke: #5cc27e; }
      .warnpill { fill: #e0904a; }
      .tw { fill: #1b1b1f; }
      .t, .m { fill: #e6e8eb; }
      .s, .l { fill: #b6bcc4; }
      .ln { stroke: #a0a7b0; }
      .life { stroke: #5c6370; }
      .hl { stroke: #6b9bff; }
      .ah { fill: #a0a7b0; }
      .ahb { fill: #6b9bff; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ahb" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="900" height="300" rx="8"/>
  <rect class="box" x="20" y="20" width="230" height="130" rx="6"/>
  <text class="t" x="34" y="42">Coding agent</text>
  <text class="l" x="34" y="58">Claude Code, or any with a shell</text>
  <rect class="acc" x="40" y="72" width="190" height="60" rx="4"/>
  <text class="m" x="52" y="94">nb (nb-cli)</text>
  <text class="l" x="52" y="112">cell add, execute, read</text>
  <rect class="acc" x="20" y="200" width="230" height="70" rx="4"/>
  <text class="t" x="34" y="224">You</text>
  <text class="l" x="34" y="244">JupyterLab, VS Code, or</text>
  <text class="l" x="34" y="259">ganymede-ui</text>
  <rect class="ok" x="340" y="20" width="220" height="250" rx="4"/>
  <text class="m" x="352" y="44">ganymede serve</text>
  <text class="l" x="352" y="74">contents API:</text>
  <text class="l" x="352" y="89">cells saved to the file</text>
  <text class="l" x="352" y="119">sessions and kernels:</text>
  <text class="l" x="352" y="134">one kernel per notebook</text>
  <text class="l" x="352" y="164">kernel websocket:</text>
  <text class="l" x="352" y="179">runs cells, outputs back</text>
  <rect class="inner" x="650" y="40" width="230" height="64" rx="4"/>
  <text class="m" x="662" y="64">analysis.ipynb</text>
  <text class="l" x="662" y="84">in --root-dir</text>
  <rect class="inner" x="650" y="160" width="230" height="64" rx="4"/>
  <text class="m" x="662" y="184">Kernel</text>
  <text class="l" x="662" y="204">state kept across nb execute</text>
  <line class="hl" x1="232" y1="96" x2="338" y2="96" marker-start="url(#b)" marker-end="url(#b)"/>
  <text class="l" x="285" y="86" text-anchor="middle">HTTP, token</text>
  <line class="ln" x1="562" y1="72" x2="648" y2="72" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="l" x="605" y="64" text-anchor="middle">read, write</text>
  <line class="ln" x1="562" y1="192" x2="648" y2="192" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="l" x="605" y="184" text-anchor="middle">ZeroMQ</text>
  <line class="ln dash" x1="252" y1="235" x2="338" y2="235" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="l" x="295" y="225" text-anchor="middle">reload to see</text>
  <text class="l" x="295" y="256" text-anchor="middle">agent's cells</text>
</svg>
