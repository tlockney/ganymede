<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 426" width="900" height="426" role="img" aria-label="Two servers on one notebook on the same machine. Server A opened a room on the file first, so it holds a lock in the runtime dir&#x27;s ganymede-rooms folder, named for the file&#x27;s path, while the room is open; its JupyterLab clients edit, and it saves and runs cells. Server B&#x27;s room on the same file is read-only: it takes in A&#x27;s saves through its watcher, never saves, undoes edits its clients send, refuses to run cells with 400, and its contents API reports the notebook as not writable. B checks the lock each second and takes it once A&#x27;s room closes or A exits. Across machines, as with a synced folder, there is no lock and rooms merge through the file. An app that embeds the server takes no lock.">
  <title>Two servers on one notebook on the same machine. Server A opened a room on the file first, so it holds a lock in the runtime dir's ganymede-rooms folder, named for the file's path, while the room is open; its JupyterLab clients edit, and it saves and runs cells. Server B's room on the same file is read-only: it takes in A's saves through its watcher, never saves, undoes edits its clients send, refuses to run cells with 400, and its contents API reports the notebook as not writable. B checks the lock each second and takes it once A's room closes or A exits. Across machines, as with a synced folder, there is no lock and rooms merge through the file. An app that embeds the server takes no lock.</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f7f9; stroke: #9aa3ad; stroke-width: 1.2; }
    .inner { fill: #ffffff; stroke: #b8c0c8; stroke-width: 1; }
    .acc { fill: #e8f0fe; stroke: #3b6fd8; stroke-width: 1.4; }
    .warn { fill: #fdf0e6; stroke: #c96a1b; stroke-width: 1.4; }
    .ok { fill: #e7f5ec; stroke: #2f8a4c; stroke-width: 1.4; }
    .dash { stroke-dasharray: 5 4; }
    .warnpill { fill: #c96a1b; }
    .tw { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #ffffff; }
    .t { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1f2328; }
    .s { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #4b535d; }
    .m { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; }
    .l { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #4b535d; }
    .ln { stroke: #6e7781; stroke-width: 1.4; fill: none; }
    .life { stroke: #9aa3ad; stroke-width: 1; stroke-dasharray: 4 4; fill: none; }
    .hl { stroke: #3b6fd8; stroke-width: 1.6; fill: none; }
    .ah { fill: #6e7781; }
    .ahb { fill: #3b6fd8; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1b1b1f; }
      .box { fill: #25262b; stroke: #5c6370; }
      .inner { fill: #1b1b1f; stroke: #4a505a; }
      .acc { fill: #1e2a44; stroke: #6b9bff; }
      .warn { fill: #3a2a1c; stroke: #e0904a; }
      .ok { fill: #1d3326; stroke: #5cc27e; }
      .warnpill { fill: #e0904a; }
      .tw { fill: #1b1b1f; }
      .t, .m { fill: #e6e8eb; }
      .s, .l { fill: #b6bcc4; }
      .ln { stroke: #a0a7b0; }
      .life { stroke: #5c6370; }
      .hl { stroke: #6b9bff; }
      .ah { fill: #a0a7b0; }
      .ahb { fill: #6b9bff; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ahb" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="900" height="426" rx="8"/>
  <rect class="acc" x="30" y="46" width="180" height="52" rx="4"/>
  <text class="t" x="44" y="68">JupyterLab</text>
  <text class="l" x="44" y="86">on server A: edits</text>
  <rect class="acc" x="30" y="256" width="180" height="52" rx="4"/>
  <text class="t" x="44" y="278">JupyterLab</text>
  <text class="l" x="44" y="296">on server B: read-only</text>
  <line class="hl" x1="212" y1="72" x2="288" y2="72" marker-start="url(#b)" marker-end="url(#b)"/>
  <line class="ln" x1="212" y1="282" x2="288" y2="282" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect class="ok" x="290" y="20" width="250" height="104" rx="4"/>
  <text class="m" x="304" y="44">Server A: owner</text>
  <text class="l" x="304" y="66">first to open a room on the file;</text>
  <text class="l" x="304" y="82">holds the lock while it is open;</text>
  <text class="l" x="304" y="98">saves, runs cells</text>
  <rect class="inner" x="290" y="150" width="250" height="50" rx="4"/>
  <text class="m" x="304" y="172">ganymede-rooms/</text>
  <text class="l" x="304" y="190">runtime dir: a lock named for the path</text>
  <rect class="box" x="290" y="226" width="250" height="128" rx="4"/>
  <text class="m" x="304" y="250">Server B: read-only room</text>
  <text class="l" x="304" y="272">takes in A’s saves, never saves;</text>
  <text class="l" x="304" y="288">undoes edits clients send;</text>
  <text class="l" x="304" y="304">refuses to run cells (400);</text>
  <text class="l" x="304" y="320">contents API: not writable;</text>
  <text class="l" x="304" y="336">takes the lock once A’s room closes</text>
  <line class="hl" x1="415" y1="126" x2="415" y2="148" marker-end="url(#b)"/>
  <text class="l" x="424" y="141">flock</text>
  <line class="ln dash" x1="415" y1="224" x2="415" y2="202" marker-end="url(#a)"/>
  <text class="l" x="424" y="217">waits, checks each second</text>
  <rect class="box" x="660" y="150" width="220" height="64" rx="4"/>
  <text class="m" x="674" y="176">analysis.ipynb</text>
  <text class="l" x="674" y="196">one file on this machine</text>
  <line class="hl" x1="542" y1="80" x2="700" y2="148" marker-end="url(#b)"/>
  <text class="l" x="632" y="100">saves</text>
  <line class="ln" x1="700" y1="216" x2="542" y2="290" marker-end="url(#a)"/>
  <text class="l" x="636" y="270">watcher</text>
  <rect class="inner" x="30" y="374" width="850" height="32" rx="4"/>
  <text class="l" x="44" y="394">Across machines, as with a notebook in a synced folder, there is no lock: rooms merge through the file. An app that embeds the server takes no lock.</text>
</svg>
