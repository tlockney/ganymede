  <rect class="inner" x="30" y="142" width="160" height="26" rx="3"/>
  <text class="s" x="40" y="159">Polars DataFrame</text>
  <rect class="inner" x="30" y="174" width="160" height="26" rx="3"/>
  <text class="s" x="40" y="191">DuckDB result</text>
  <rect class="acc" x="212" y="111" width="140" height="56" rx="3"/>
  <text class="m" x="224" y="135">jupyter.table()</text>
  <text class="l" x="224" y="153">typed columns, capped</text>
  <line class="ln" x1="190" y1="91" x2="210" y2="139" marker-end="url(#a)"/>
  <line class="ln" x1="190" y1="123" x2="210" y2="139" marker-end="url(#a)"/>
  <line class="ln" x1="190" y1="155" x2="210" y2="139" marker-end="url(#a)"/>
  <line class="ln" x1="190" y1="187" x2="210" y2="139" marker-end="url(#a)"/>
  <rect class="ok" x="374" y="78" width="280" height="44" rx="3"/>
  <text class="m" x="384" y="97">application/vnd.dataresource+json</text>
  <text class="l" x="384" y="114">schema, up to 1,000 rows, total row count</text>
  <rect class="ok" x="374" y="130" width="280" height="44" rx="3"/>
  <text class="m" x="384" y="149">text/html</text>
  <text class="l" x="384" y="166">plain table, first 20 rows</text>
  <rect class="ok" x="374" y="182" width="280" height="44" rx="3"/>
  <text class="m" x="384" y="201">text/plain</text>
  <text class="l" x="384" y="218">shape, column types and ranges, 5 rows</text>
  <line class="ln" x1="352" y1="139" x2="372" y2="100" marker-end="url(#a)"/>
  <line class="ln" x1="352" y1="139" x2="372" y2="152" marker-end="url(#a)"/>
  <line class="ln" x1="352" y1="139" x2="372" y2="204" marker-end="url(#a)"/>
  <text class="s" x="688" y="96">apps: sort, page, typed columns</text>
  <text class="s" x="688" y="112">nb publish: static table</text>
  <line class="ln" x1="654" y1="100" x2="682" y2="100" marker-end="url(#a)"/>
  <text class="s" x="688" y="156">JupyterLab, VS Code, GitHub</text>
  <line class="ln" x1="654" y1="152" x2="682" y2="152" marker-end="url(#a)"/>
  <text class="s" x="688" y="208">agents (MCP), jupyter console</text>
  <line class="ln" x1="654" y1="204" x2="682" y2="204" marker-end="url(#a)"/>
  <rect class="box" x="20" y="244" width="860" height="130" rx="4"/>
  <text class="l" x="30" y="262">Chart</text>
  <rect class="inner" x="30" y="274" width="160" height="26" rx="3"/>
  <text class="s" x="40" y="291">Vega-Lite spec</text>
  <rect class="inner" x="30" y="306" width="160" height="26" rx="3"/>
  <text class="s" x="40" y="323">Plot module + options</text>
  <rect class="acc" x="212" y="275" width="140" height="56" rx="3"/>
  <text class="m" x="224" y="299">jupyter.chart()</text>
  <text class="l" x="224" y="317">headless render</text>
  <line class="ln" x1="190" y1="287" x2="210" y2="303" marker-end="url(#a)"/>
  <line class="ln" x1="190" y1="319" x2="210" y2="303" marker-end="url(#a)"/>
  <rect class="ok" x="374" y="274" width="280" height="44" rx="3"/>
  <text class="m" x="384" y="293">image/svg+xml</text>
  <text class="l" x="384" y="310">legend and title inside, currentColor text</text>
  <rect class="ok" x="374" y="326" width="280" height="44" rx="3"/>
  <text class="m" x="384" y="345">text/plain</text>
  <text class="l" x="384" y="362">marks, encodings, ranges, rows</text>
  <line class="ln" x1="352" y1="303" x2="372" y2="296" marker-end="url(#a)"/>
  <line class="ln" x1="352" y1="303" x2="372" y2="348" marker-end="url(#a)"/>
  <text class="s" x="688" y="292">apps, JupyterLab, VS Code,</text>
  <text class="s" x="688" y="308">nb publish; agents get a PNG</text>
  <line class="ln" x1="654" y1="296" x2="682" y2="296" marker-end="url(#a)"/>
  <text class="s" x="688" y="352">agents (MCP), jupyter console</text>
  <line class="ln" x1="654" y1="348" x2="682" y2="348" marker-end="url(#a)"/>
  <text class="l" x="30" y="404">Libraries load on first use: vega and vega-lite for specs, linkedom as Plot&#x27;s DOM where there is none</text>
  <text class="l" x="30" y="420">(Node, Deno, Bun, the in-app Worker). The notebook stays valid .ipynb; the server learns no new protocol.</text>
