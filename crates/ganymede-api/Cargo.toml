[package]
name = "ganymede-api"
description = "The server API as plain functions over the kernel host: kernel and session managers, response models, the websocket bridge. No HTTP framework, so an in-app bridge and the HTTP server share it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["zmq", "subprocess"]
# Kernels over ZeroMQ: `ZmqTransportFactory`.
zmq = ["ganymede-kernel-host/zmq"]
# Kernels launched from kernelspecs as child processes.
subprocess = ["ganymede-kernel-host/subprocess"]

[dependencies]
ganymede-protocol = { path = "../ganymede-protocol" }
ganymede-kernel-host = { path = "../ganymede-kernel-host", default-features = false }
ganymede-contents = { path = "../ganymede-contents" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
tokio.workspace = true
async-trait.workspace = true
futures.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
