[package]
name = "ganymede-nbformat"
description = "Jupyter notebook file format (nbformat v4): types, lenient reader, and a writer that matches Python nbformat byte for byte. No I/O beyond optional file helpers."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true

# Browser wasm has no OS randomness; take it from JavaScript.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
uuid = { workspace = true, features = ["js"] }

[dev-dependencies]
tempfile.workspace = true
