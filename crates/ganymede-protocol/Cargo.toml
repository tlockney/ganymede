[package]
name = "ganymede-protocol"
description = "Jupyter messaging protocol types, ZMQ wire framing with HMAC, connection files, and websocket codecs. No I/O."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
hmac.workspace = true
sha2.workspace = true
hex.workspace = true
bytes.workspace = true

# Browser wasm has no OS randomness or clock; take both from JavaScript.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
uuid = { workspace = true, features = ["js"] }
chrono = { workspace = true, features = ["wasmbind"] }
