[package]
name = "ganymede-host"
description = "The host API for kernels: a comm the host opens to each kernel, on which cell code calls the host by method name with JSON."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ganymede-protocol = { path = "../ganymede-protocol" }
ganymede-kernel-host = { path = "../ganymede-kernel-host", default-features = false }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tokio.workspace = true
async-trait.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
