[package]
name = "ganymede-cli"
description = "The `ganymede` command: kernelspecs, running code, a console, executing notebooks, standalone kernels, and the server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ganymede"
path = "src/main.rs"

# Regenerates CHANGELOG.md during `cargo release` (scripts/release.sh). The
# hook lives on one crate so it runs once per release, not once per crate.
[package.metadata.release]
pre-release-hook = ["sh", "-c", "cd \"$WORKSPACE_ROOT\" && if [ \"$DRY_RUN\" = true ]; then git cliff --tag \"v$NEW_VERSION\" --unreleased; else git cliff --tag \"v$NEW_VERSION\" -o CHANGELOG.md; fi"]
# Docs that name the current release.
pre-release-replacements = [
  { file = "../../docs/embedding.md", search = 'tag = "v[0-9][^"]*" \}', replace = 'tag = "v{{version}}" }', exactly = 1 },
  { file = "../../docs/reference.md", search = '"ganymede_version": "[^"]*"', replace = '"ganymede_version": "{{version}}"', exactly = 1 },
]

[features]
# Opt-in crash reports to Sentry (docs/privacy.md). Release builds turn it
# on; even then nothing is sent unless the user opts in at run time.
crash-reporting = ["dep:sentry"]

[dependencies]
ganymede-engine = { path = "../ganymede-engine" }
ganymede-server = { path = "../ganymede-server" }
ganymede-contents = { path = "../ganymede-contents", features = ["sqlite"] }
clap.workspace = true
clap_complete = "4"
tokio = { workspace = true, features = ["rt-multi-thread", "net", "signal"] }
serde_json.workspace = true
async-trait.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rustyline = "19"
sha2.workspace = true
tempfile.workspace = true
hex.workspace = true
uuid.workspace = true
# `ganymede lab install`: HTTPS (rustls, platform trust store, proxy from
# the environment) and the wheel's zip format, all in Rust.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "json"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# `crash-reporting`: panics and errors to Sentry over the ureq/rustls stack
# already used above. No default features: no breadcrumbs from logs, no
# release-health sessions. `debug-images` lists the loaded images once at
# start, only when opted in, so Sentry can symbolicate stripped binaries.
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "debug-images", "panic", "tracing", "ureq", "rustls"], optional = true }

[dev-dependencies]
tempfile.workspace = true
# A rogue peer on a kernel's stdin socket, in tests/kernels.rs.
zeromq.workspace = true
bytes.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures.workspace = true
ganymede-nbformat = { path = "../ganymede-nbformat" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
