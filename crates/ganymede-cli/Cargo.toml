[package]
name = "ganymede-cli"
description = "The `ganymede` command: kernelspecs, running code, a console, executing notebooks, standalone kernels, and the server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ganymede"
path = "src/main.rs"

# Regenerates CHANGELOG.md during `cargo release` (scripts/release.sh). The
# hook lives on one crate so it runs once per release, not once per crate.
[package.metadata.release]
pre-release-hook = ["sh", "-c", "cd \"$WORKSPACE_ROOT\" && if [ \"$DRY_RUN\" = true ]; then git cliff --tag \"v$NEW_VERSION\" --unreleased; else git cliff --tag \"v$NEW_VERSION\" -o CHANGELOG.md; fi"]

[dependencies]
ganymede-engine = { path = "../ganymede-engine" }
ganymede-server = { path = "../ganymede-server" }
ganymede-contents = { path = "../ganymede-contents", features = ["sqlite"] }
clap.workspace = true
clap_complete = "4"
tokio = { workspace = true, features = ["rt-multi-thread", "net", "signal"] }
serde_json.workspace = true
async-trait.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rustyline = "19"
sha2.workspace = true
tempfile.workspace = true
hex.workspace = true
# `ganymede lab install`: HTTPS (rustls, platform trust store, proxy from
# the environment) and the wheel's zip format, all in Rust.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "json"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
