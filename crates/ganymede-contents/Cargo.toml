[package]
name = "ganymede-contents"
description = "Contents seam of the server: the jupyter_server /api/contents model, a Contents trait, a filesystem implementation with atomic writes, mtime conflict checks and a relocatable checkpoint directory, and notebook trust (signing)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Jupyter's nbsignatures.db, through SQLite compiled from C. Off by default
# so the crate checks for iOS and Android without a C cross toolchain; the
# server turns it on. Without it signatures live in memory.
sqlite = ["dep:rusqlite"]

[dependencies]
sha2.workspace = true
hmac.workspace = true
getrandom = "0.4"
rusqlite = { version = "0.41", default-features = false, features = ["bundled"], optional = true }
hex.workspace = true
ganymede-nbformat = { path = "../ganymede-nbformat" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true
tempfile.workspace = true
uuid.workspace = true
base64 = "0.23"
mime_guess = "2"

# No-replace rename (renameat2, renamex_np) for `rename`.
[target.'cfg(any(target_os = "linux", target_os = "android", target_os = "macos", target_os = "ios"))'.dependencies]
libc = "0.2"
