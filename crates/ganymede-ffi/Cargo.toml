[package]
name = "ganymede-ffi"
description = "A C ABI for running the Ganymede server inside an app: start it on loopback, get its URL, stop it. Built as a static library for the Swift shell."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = ["zmq", "subprocess", "gateway"]
# Kernelspecs run as child processes over ZeroMQ, as `ganymede serve`
# runs them. The macOS slice keeps these; the iOS slices build without
# them (scripts/build-xcframework.sh), where an app can't start
# processes, and the server then has no kernels of its own.
zmq = ["ganymede-server/zmq"]
subprocess = ["ganymede-server/subprocess"]
# `gateway_url`: kernels on another Jupyter server.
gateway = ["ganymede-server/gateway"]
# `ganymede_v8_bench_run`: the engine benchmark on V8 (#892), for the apps'
# Settings. Off by default: it downloads rusty_v8's prebuilt static library
# for the target and links it in (tens of MB), which only the XCFramework
# wants (scripts/build-xcframework.sh). Without it the same functions are
# exported and report that V8 isn't built in.
v8-bench = ["dep:v8", "dep:serde", "dep:libc"]

[dependencies]
ganymede-server = { path = "../ganymede-server", default-features = false }
ganymede-api = { path = "../ganymede-api", default-features = false }
ganymede-kernel-host = { path = "../ganymede-kernel-host", default-features = false }
async-trait.workspace = true
base64.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
anyhow.workspace = true
tracing.workspace = true
# Only with `v8-bench`. V8 is pinned exactly: a rusty_v8 release is a V8
# release, and the spike (spikes/v8-engine) measured this one.
v8 = { version = "=152.2.0", optional = true }
serde = { workspace = true, optional = true }
libc = { version = "0.2", optional = true }

[dev-dependencies]
tempfile.workspace = true
