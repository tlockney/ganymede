[package]
name = "ganymede-server"
description = "HTTP server: axum routes over ganymede-api and ganymede-contents, token and cookie auth, websocket channels, static assets."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ganymede-server"
path = "src/main.rs"

[dependencies]
ganymede-protocol = { path = "../ganymede-protocol" }
ganymede-kernel-host = { path = "../ganymede-kernel-host" }
ganymede-api = { path = "../ganymede-api" }
ganymede-contents = { path = "../ganymede-contents" }
axum.workspace = true
tower-http.workspace = true
tower.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "fs", "signal"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
toml.workspace = true
anyhow.workspace = true
tempfile.workspace = true
json5 = "0.4"
hmac.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
getrandom = "0.4"
form_urlencoded = "1"

[dev-dependencies]
tokio-tungstenite.workspace = true
async-trait.workspace = true
