[package]
name = "ganymede-server"
description = "HTTP server: axum routes over ganymede-api and ganymede-contents, token and cookie auth, websocket channels, static assets."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ganymede-server"
path = "src/main.rs"

[features]
default = ["zmq", "subprocess", "gateway", "svg"]
# The kernels `run_with` makes when `Startup` names none: ZeroMQ transports
# and subprocess launches. An app that brings its own builds without them.
zmq = ["ganymede-api/zmq"]
subprocess = ["ganymede-api/subprocess"]
# `gateway_url`: kernels on another Jupyter server.
gateway = ["dep:ganymede-gateway"]
# `ganymede mcp` shows SVG outputs to the agent as PNG (resvg, pure Rust).
svg = ["dep:resvg"]

[dependencies]
ganymede-protocol = { path = "../ganymede-protocol" }
ganymede-kernel-host = { path = "../ganymede-kernel-host", default-features = false }
ganymede-api = { path = "../ganymede-api", default-features = false }
ganymede-contents = { path = "../ganymede-contents", features = ["sqlite"] }
ganymede-documents = { path = "../ganymede-documents" }
ganymede-exec = { path = "../ganymede-exec" }
ganymede-nbformat = { path = "../ganymede-nbformat" }
ganymede-gateway = { path = "../ganymede-gateway", optional = true }
ganymede-terminals = { path = "../ganymede-terminals" }
ganymede-lsp = { path = "../ganymede-lsp" }
# No memory-mapped fonts (unsafe) and no raster images inside SVGs.
resvg = { version = "0.49", default-features = false, features = ["text", "system-fonts"], optional = true }
axum.workspace = true
tower-http.workspace = true
tower.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "fs", "signal"] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
toml.workspace = true
anyhow.workspace = true
tempfile.workspace = true
json5 = "1.3"
hmac.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
getrandom = "0.4"
form_urlencoded = "1"
mime_guess = "2"
# nbconvert's zip of a Markdown export and its images (#235); the
# ganymede-cli dependency, with the same features.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
dirs.workspace = true
rmcp = { version = "3.8", default-features = false, features = ["server", "macros", "transport-io", "transport-streamable-http-server", "schemars"] }

# Watching notebooks' directories for changes made by other programs
# (document rooms). Elsewhere, such as iOS, rooms poll.
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
# Kernel and server memory and CPU (/api/metrics/v1). Elsewhere, such as
# iOS, kernels have no process to measure and replies say so.
sysinfo = { version = "0.40", default-features = false, features = ["system"] }

[dev-dependencies]
tokio-tungstenite.workspace = true
async-trait.workspace = true
