[package]
name = "ganymede-engine"
description = "The library to embed: discover kernelspecs, start or attach kernels, execute code with streaming output and stdin, run notebooks. Re-exports the core crates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["zmq", "subprocess"]
# Kernels over ZeroMQ: `Engine::start`, `attach`, `connect`.
zmq = ["ganymede-kernel-host/zmq"]
# The default provisioner, which launches kernelspecs as child processes.
subprocess = ["ganymede-kernel-host/subprocess"]

[dependencies]
ganymede-protocol = { path = "../ganymede-protocol" }
ganymede-nbformat = { path = "../ganymede-nbformat" }
ganymede-kernel-host = { path = "../ganymede-kernel-host", default-features = false }
ganymede-exec = { path = "../ganymede-exec" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
async-trait.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
tempfile.workspace = true
anyhow.workspace = true
