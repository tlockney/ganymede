# git-cliff configuration: CHANGELOG.md lists the pull requests merged
# into each release. scripts/release.sh regenerates it; see README.

[changelog]
header = """
# Changelog

Pull requests merged into each release. Generated by
[git-cliff](https://git-cliff.org) from `cliff.toml`; do not edit by hand.\
"""
body = """

{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}](https://github.com/tlockney/ganymede/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}
{% for commit in commits %}\
- {{ commit.message | split(pat="\n") | first | trim }}
{% endfor %}\
"""
trim = false
footer = ""

[git]
conventional_commits = false
filter_unconventional = false
# A merge commit "Merge pull request #N from <branch>" carries the PR title
# as its body; a squash merge's subject is "<title> (#N)", usually followed
# by a body. Both become one line, "<title> (#N)" with a link. Only commits
# GitHub committed (merges and squashes) are kept: commits on a PR branch
# can also end in "(#N)", but their committer is the author.
commit_preprocessors = [
  { pattern = '(?s)^Merge pull request #(\d+) from \S+\s*\n\s*([^\n]+).*', replace = "${2} (#${1})" },
  { pattern = '(?s)^([^\n]*)\(#(\d+)\)\s*(\n.*)?$', replace = "${1}([#${2}](https://github.com/tlockney/ganymede/pull/${2}))" },
  # The docs site renders CHANGELOG.md through Vue, which reads a bare
  # "<pid>" in a title as an unclosed tag and fails the build.
  { pattern = '<', replace = "&lt;" },
]
# The release PR itself ("Release vX.Y.Z") is not a change.
commit_parsers = [
  { message = '^Release v?\d', skip = true },
  { field = "committer.name", pattern = '^GitHub$', message = '\(\[#\d+\]\(https://github.com/tlockney/ganymede/pull/\d+\)\)$', group = "Changes" },
  { message = ".*", skip = true },
]
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "newest"
