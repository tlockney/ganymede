# cargo deny check advisories bans sources (ci.yml, the `audit` job).
# Licenses are checked by cargo-about against about.toml, which also
# writes the third-party notices, so that list lives in one place.

[graph]
all-features = true

[advisories]
# Every RustSec advisory against a crate in Cargo.lock fails the job,
# unmaintained and unsound ones included. Ignore one only with a reason
# and a link here.
ignore = [
    # smallstr is unmaintained (no vulnerability). It comes in through yrs
    # 0.28, the only Rust Yjs, which ganymede-documents needs; yrs has no
    # release without it yet. Drop this when yrs moves off smallstr.
    { id = "RUSTSEC-2026-0215", reason = "unmaintained, via yrs; no alternative" },
    # chrono is unmaintained (no vulnerability, no fixed release). Ganymede's
    # own crates use jiff since #855; chrono still comes in through rmcp
    # (and schemars, through rmcp). Drop this when rmcp moves off chrono;
    # #855 stays open for that. Revisit by 2027-02-17.
    { id = "RUSTSEC-2026-0543", reason = "unmaintained, via rmcp and schemars" },
    # paste is unmaintained (no vulnerability; a build-time proc macro). It
    # comes in only through v8 (rusty_v8), behind ganymede-ffi's off-by-
    # default `v8-bench` feature (#892). Drop this when v8 moves off paste,
    # or when V8 leaves the apps after the engine decision (#646).
    { id = "RUSTSEC-2024-0436", reason = "unmaintained, via v8 (v8-bench only)" },
]

[bans]
# Two versions of one crate are worth knowing about but rarely worth a
# fork: shown as warnings, not failures.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
