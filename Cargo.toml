[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "arbitrary_precision"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
base64 = "0.22"
bytes = "1"
# Portable features only; crates that need sockets, processes, or signals
# add them, so the core libraries build for wasm.
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "io-util"] }
async-trait = "0.1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
tempfile = "3"
dirs = "7"
zeromq = { version = "0.6", default-features = false, features = ["tokio-runtime", "tcp-transport"] }
clap = { version = "4", features = ["derive"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }
tower = "0.5"
tokio-tungstenite = "0.30"
toml = "0.9"

# What release.yml ships. Measured on x86_64 Linux (0.1.0): the binary
# goes from 19.8 MB to 12.8 MB, and a clean build stays at about 2.5
# minutes.
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
